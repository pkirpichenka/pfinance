<title>Финансы — личный дашборд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#EAEEF2; --surface:#FFFFFF; --surface-2:#F6F8FA; --surface-3:#EFF3F6;
  --ink:#161A21; --ink-2:#3B4250; --muted:#697386; --faint:#9AA4B2;
  --line:#E1E7ED; --line-strong:#D2DAE2;
  --personal:#0E7C6B; --personal-bg:#E6F4F0; --personal-line:#BFE4DB;
  --biz:#B26A08; --biz-bg:#FBF1E1; --biz-line:#EDD6AF;
  --asset:#2456C7; --asset-bg:#E7EEFB;
  --liab:#C1334C; --liab-bg:#FBE9EC;
  --goal:#6B3FA0; --goal-bg:#F0E9F8;
  --ok:#0E7C6B; --warn:#B26A08; --bad:#C1334C;
  --radius:15px; --radius-s:10px;
  --shadow:0 1px 2px rgba(20,30,45,.04),0 8px 24px -12px rgba(20,30,45,.14);
  --shadow-s:0 1px 2px rgba(20,30,45,.06);
  --mono:'Inter',system-ui,sans-serif;
  --disp:'Space Grotesk',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#0E1116; --surface:#171B22; --surface-2:#1E232C; --surface-3:#252B35;
  --ink:#EAEEF3; --ink-2:#B9C2CE; --muted:#8A94A3; --faint:#5F6875;
  --line:#2A313B; --line-strong:#3A424E;
  --personal:#39C7AE; --personal-bg:#123029;
  --biz:#E0A24A; --biz-bg:#2E2413;
  --asset:#6C97F0; --asset-bg:#152238;
  --liab:#E77389; --liab-bg:#331821;
  --goal:#B08BE0; --goal-bg:#241A33;
}
[data-theme="dark"] .split .side.personal{background:linear-gradient(180deg,var(--personal-bg),var(--surface) 78%)}
[data-theme="dark"] .split .side.biz{background:linear-gradient(180deg,var(--biz-bg),var(--surface) 78%)}
[data-theme="dark"] .reminder{background:var(--surface-3)}
[data-theme="dark"] .reminder .btn{background:var(--ink);color:var(--bg);border-color:var(--ink)}
[data-theme="dark"] .nav-item.on,[data-theme="dark"] .btn.primary{background:var(--ink);color:var(--bg)}
[data-theme="dark"] .btn.primary:hover{background:var(--ink-2)}
[data-theme="dark"] .brand .mark,[data-theme="dark"] .mobile-top .mark{background:var(--ink);color:var(--bg)}
[data-theme="dark"] .chip.c-contribution{background:var(--surface-3);color:var(--ink-2)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--body); background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; font-size:14.5px; line-height:1.45;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14.5px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.amt,.num,.stat .val,.side .sub .v,.personal-net-worth .v,.compact-amount,.compact-balance-value{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
h1,h2,h3,h4{font-family:var(--disp);margin:0;font-weight:600;letter-spacing:-.01em}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh;min-width:0}
.nav{
  background:var(--surface);border-right:1px solid var(--line);
  padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;
  display:flex;flex-direction:column;gap:4px
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
.brand .mark{
  width:30px;height:30px;border-radius:9px;background:var(--ink);
  display:grid;place-items:center;color:#fff;font-family:var(--disp);font-weight:700;font-size:15px;
  flex:0 0 auto
}
.brand b{font-family:var(--disp);font-weight:600;font-size:15.5px;letter-spacing:-.01em}
.brand small{display:block;color:var(--faint);font-size:11px;font-weight:500;margin-top:1px}
.theme-toggle{width:34px;height:34px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;font-size:17px;line-height:1;flex:0 0 auto}
.theme-toggle:hover{background:var(--surface-3);color:var(--ink)}
.brand .theme-toggle{margin-left:auto}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--radius-s);
  color:var(--ink-2);font-weight:500;border:none;background:none;width:100%;text-align:left;
  font-size:14px;transition:background .12s,color .12s
}
.nav-item svg{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;opacity:.85}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.on{background:var(--ink);color:#fff}
.nav-item.on svg{opacity:1}
.nav-sep{height:1px;background:var(--line);margin:8px 6px}
.nav-foot{margin-top:auto;padding:8px;color:var(--faint);font-size:11px;line-height:1.5}

.main{padding:26px 30px 60px;max-width:1180px;width:100%;min-width:0}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head .t h1{font-size:23px}
.page-head .t p{display:none}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:500;
  font-size:13.5px;transition:.12s;white-space:nowrap
}
.btn svg{width:16px;height:16px;stroke:currentColor}
.btn:hover{background:var(--surface-2);border-color:var(--line-strong)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#242a34}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--bad);border-color:var(--liab-bg)}
.btn.danger:hover{background:var(--liab-bg)}

/* ---------- Cards / grid ---------- */
.grid{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-s)}
.card.pad{padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:14px}
.card-b{padding:14px 18px}
.eyebrow{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}

/* reminder banner */
.reminder{
  display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;
  border-radius:var(--radius);padding:14px 18px;margin-bottom:18px
}
.reminder .dot{width:9px;height:9px;border-radius:50%;background:#F5C451;flex:0 0 auto;box-shadow:0 0 0 4px rgba(245,196,81,.22)}
.reminder .txt{flex:1}
.reminder .txt b{font-family:var(--disp);font-size:14.5px}
.reminder .txt span{display:block;color:#B9C1CD;font-size:12.5px;margin-top:1px}
.reminder .btn{background:#fff;color:var(--ink);border-color:#fff}
.reminder .x{background:none;border:none;color:#8b94a3;font-size:18px;line-height:1;padding:4px}

/* ---------- Split balance (signature) ---------- */
.split{display:grid;grid-template-columns:1.15fr 1fr;gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.split .side{padding:22px 24px;position:relative}
.split .side.personal{background:linear-gradient(180deg,var(--personal-bg),#fff 78%)}
.split .side.biz{background:linear-gradient(180deg,var(--biz-bg),#fff 78%);border-left:1px solid var(--line)}
.side .lbl{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;font-family:var(--disp)}
.side .lbl .tag{width:8px;height:8px;border-radius:2px}
.personal .tag{background:var(--personal)}.biz .tag{background:var(--biz)}
.side .hint{display:none}
.side .amt{font-family:var(--mono);font-weight:700;font-size:34px;letter-spacing:-.03em;line-height:1}
.personal .amt{color:var(--personal)}.biz .amt{color:var(--biz)}
.side .sub{margin-top:12px;display:flex;gap:18px;flex-wrap:wrap}
.side .sub .k{font-size:10px;color:var(--faint);font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase}
.side .sub .v{font-family:var(--mono);font-weight:600;font-size:14px;display:block;margin-top:1px}

/* ---------- Stat cards ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-s)}
.stat .top{display:flex;align-items:center;justify-content:space-between}
.stat .name{font-size:11px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stat .ico{width:24px;height:24px;border-radius:8px;display:grid;place-items:center}
.stat .ico svg{width:15px;height:15px}
.stat .val{font-family:var(--mono);font-weight:700;font-size:24px;letter-spacing:-.03em;margin-top:10px}
.stat .foot{display:none}
.i-in{background:var(--personal-bg);color:var(--personal)}
.i-out{background:var(--liab-bg);color:var(--liab)}
.i-asset{background:var(--asset-bg);color:var(--asset)}
.i-liab{background:var(--liab-bg);color:var(--liab)}
.i-biz{background:var(--biz-bg);color:var(--biz)}
.i-goal{background:var(--goal-bg);color:var(--goal)}

.pos{color:var(--personal)}.neg{color:var(--liab)}.amber{color:var(--biz)}.blue{color:var(--asset)}.purple{color:var(--goal)}

/* ---------- Table ---------- */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-family:var(--mono);padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--surface-3);font-size:13.5px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:500;font-family:var(--mono)}
.chip .d{width:6px;height:6px;border-radius:50%}
.chip.c-in{background:var(--personal-bg);color:var(--personal)}
.chip.c-out{background:var(--liab-bg);color:var(--liab)}
.chip.c-draw{background:var(--biz-bg);color:var(--biz)}
.chip.c-contribution{background:#EEF1F4;color:var(--ink-2)}
.chip.c-biz_income{background:var(--personal-bg);color:var(--personal)}
.chip.c-biz_expense{background:var(--liab-bg);color:var(--liab)}
.chip.c-adjustment{background:var(--surface-3);color:var(--ink-2)}
.chip.c-transfer{background:var(--asset-bg);color:var(--asset)}
.tag-cat{background:var(--surface-3);color:var(--ink-2);padding:2px 8px;border-radius:6px;font-size:12px}

/* ---------- Forms ---------- */
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:500;color:var(--ink-2);margin-bottom:5px}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.inp,select.inp,textarea.inp{
  width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--radius-s);
  background:var(--surface);color:var(--ink);transition:.12s;outline:none
}
.inp:focus{border-color:var(--personal);box-shadow:0 0 0 3px var(--personal-bg)}
textarea.inp{resize:vertical;min-height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* type picker */
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.type-btn{
  border:1px solid var(--line-strong);background:var(--surface);border-radius:11px;padding:11px 10px;
  text-align:left;transition:.12s;display:flex;flex-direction:column;gap:2px
}
.type-btn:hover{border-color:var(--line-strong);background:var(--surface-2)}
.type-btn.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.type-btn .tt{font-weight:600;font-size:13px;font-family:var(--disp)}
.type-btn .td{font-size:10.5px;color:var(--muted);line-height:1.3}
.type-btn .bar{height:3px;border-radius:2px;margin-bottom:6px;width:26px}

/* segmented */
.seg{display:inline-flex;background:var(--surface-3);border-radius:9px;padding:3px;gap:2px}
.seg button{border:none;background:none;padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s)}

/* progress */
.prog{height:9px;border-radius:20px;background:var(--surface-3);overflow:hidden}
.prog>span{display:block;height:100%;border-radius:20px;transition:width .25s ease}

/* empty */
.empty{text-align:center;padding:34px 18px;color:var(--muted)}
.empty svg{width:34px;height:34px;stroke:var(--faint);margin-bottom:10px}
.empty b{display:block;font-family:var(--disp);color:var(--ink);font-size:15px;margin-bottom:3px}.empty.compact{padding:22px 16px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(22,26,33,.42);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:50;padding:20px;animation:fade .15s}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:520px;max-height:90vh;overflow:auto;box-shadow:0 24px 60px -18px rgba(20,30,45,.4)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.modal-h h3{font-size:16px}
.modal-b{padding:20px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:0 20px 20px}
.x-btn{background:none;border:none;font-size:20px;color:var(--muted);line-height:1;padding:4px 6px;border-radius:6px}
.x-btn:hover{background:var(--surface-2)}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* toast */
.toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;box-shadow:var(--shadow);animation:pop .2s;display:flex;align-items:center;gap:9px}
.toast .d{width:7px;height:7px;border-radius:50%;background:var(--personal)}
.toast .msg{white-space:nowrap}
.toast .undo{border:none;background:none;color:#fff;font-weight:700;padding:3px 0 3px 8px;text-decoration:underline;text-underline-offset:3px}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* misc */
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--surface-3)}

.avatar{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--disp);font-weight:600;font-size:13px;flex:0 0 auto}
.muted{color:var(--muted)}.fs12{font-size:12px}.fs13{font-size:13px}
.spacer{flex:1}
.due-soon{color:var(--biz);font-weight:600}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.overview-period{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:flex-end;margin:-4px 0 14px;position:relative;z-index:1;max-width:100%}
.overview-period .seg{max-width:100%}
.overview-period{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-bottom:14px}.overview-period .eyebrow{margin-right:2px}.overview-period .seg{box-shadow:inset 0 0 0 1px var(--line)}
.ov-hero{border-radius:18px;box-shadow:var(--shadow)}
.ov-hero .side{padding:24px 24px 20px}.ov-hero .side .amt{margin-top:6px}.ov-hero .side .sub{margin-top:14px;row-gap:12px}.ov-hero .side .sub>div{min-width:126px}.ov-hero .side .sub .v{margin-top:4px;font-size:15px}
.reminder{padding:12px 16px;border-radius:16px}.reminder .txt b{font-size:14px}.reminder .txt span{font-size:12px}
.ov-kpis .stat{border-radius:16px}.ov-kpis-2{grid-template-columns:repeat(2,minmax(0,1fr))}.ov-grid-main,.ov-grid-secondary{gap:16px}.ov-grid-main .card,.ov-grid-secondary .card{border-radius:16px}.ov-grid-main .card-h .fs12,.ov-grid-secondary .card-h .fs12{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}.forecast-compact .kpi-line{padding:8px 0;border-bottom:1px solid var(--surface-3)}.forecast-compact .kpi-line:last-of-type{border-bottom:none}.forecast-compact .kpi-line span{font-size:12px}.forecast-compact .kpi-line b{font-family:var(--mono);font-size:16px}.forecast-compact .note{display:none}
.overview-period button{pointer-events:auto}
.mobile-nav{display:none}

.sheet-item{display:flex;align-items:center;gap:13px;padding:14px 8px;border:none;background:none;width:100%;text-align:left;font-size:15.5px;color:var(--ink);border-bottom:1px solid var(--surface-3)}

.compact-add .compact-amount .sgn{font-size:26px;margin-right:2px}.compact-add .compact-amount .cur{font-size:16px;color:var(--muted);margin-left:6px;font-weight:500}

.compact-add .compact-preview{margin-top:9px;font-size:12px;color:var(--muted);min-height:17px}.compact-add .compact-preview b{font-family:var(--mono);color:var(--ink-2)}.compact-add .compact-preview .chg{color:var(--liab);font-weight:600}.compact-add .compact-preview .chg.pos{color:var(--personal)}

  }

  .mobile-top .top-add svg{width:15px;height:15px;stroke:#fff}

  .bottom-nav{

<script>
"use strict";
/* =========================================================
   ХРАНИЛИЩЕ (Supabase с деградацией в память)
   ========================================================= */
const KEY="pf:state:v3";
/* --- Синхронизация и защита от затирания (Фаза 2) ---
   Ревизия состояния хранится ВНУТРИ блоба (meta.rev) — схему таблицы Supabase
   менять не нужно. Перед облачной записью проверяем, не ушла ли удалённая
   ревизия вперёд (другое устройство); если да — не затираем молча, а спрашиваем. */
let baseRev=0;            // ревизия, на которой основано текущее состояние S
let syncDirty=false;      // есть несохранённые в облако изменения
let syncState='local';    // 'synced'|'saving'|'offline'|'local'|'conflict'
let _saveInFlight=false,_savePending=false;
function stateRev(st){return (st&&st.meta&&Number(st.meta.rev))||0;}
const SYNC_LABEL={synced:'✓ синхронизировано',saving:'⟳ сохранение…',offline:'⚠ офлайн — сохранено локально',local:'✓ сохранено локально',conflict:'⚠ конфликт синхронизации'};
function syncLabel(){return SYNC_LABEL[syncState]||'';}
function updateSyncIndicators(){
  const tone={synced:'ok',saving:'busy',offline:'warn',local:'ok',conflict:'warn'}[syncState]||'';
  document.querySelectorAll('[data-sync-indicator]').forEach(el=>{el.textContent=syncLabel();el.classList.remove('sync-ok','sync-busy','sync-warn');if(tone)el.classList.add('sync-'+tone);});
}
function setSyncStatus(s){syncState=s;updateSyncIndicators();}
const Store={
  async load(){
    try{ if(window.PFBackend){ const r=await window.PFBackend.load(); if(r) return r; } }
    catch(e){ /* оффлайн/пауза — уходим в память */ }
    try{ if(window.__mem) return JSON.parse(window.__mem); }catch(e){}
    return null;
  },
  async save(state){
    window.__mem=JSON.stringify(state);
    if(!window.PFBackend){ syncDirty=false; setSyncStatus('local'); return; }
    if(_saveInFlight){ _savePending=true; return; }
    _saveInFlight=true; setSyncStatus('saving');
    try{
      let remote=null;
      try{ remote=await window.PFBackend.load(); }
      catch(e){ setSyncStatus('offline'); return; }
      if(remote!==null && stateRev(remote)>baseRev){
        setSyncStatus('conflict'); showSyncConflict(remote); return;
      }
      state.meta=state.meta||{}; state.meta.rev=baseRev+1;
      await window.PFBackend.save(state);
      baseRev=state.meta.rev; window.__mem=JSON.stringify(state);
      syncDirty=false; setSyncStatus('synced');
    }catch(e){ setSyncStatus('offline'); }
    finally{
      _saveInFlight=false;
      if(_savePending){ _savePending=false; Store.save(S); }
    }
  }
};
async function reconcileFromRemote(){
  if(!window.PFBackend||_saveInFlight)return;
  let remote;try{remote=await window.PFBackend.load();}catch(e){setSyncStatus('offline');return;}
  if(!remote)return;
  if(stateRev(remote)>baseRev){ if(syncDirty)showSyncConflict(remote); else applyRemoteState(remote,true); }
}
function applyRemoteState(remote,notifyUser){
  const ui=S&&S.ui;
  S=remote; ensureBusinessModel(); ensureUxState(); if(ui)S.ui=ui;
  baseRev=stateRev(remote); syncDirty=false; setSyncStatus('synced');
  applyTheme(); render(); if(S.ui.view==='add')setTimeout(refreshAddForm,0);
  if(notifyUser)toast('Данные обновлены с другого устройства');
}
function showSyncConflict(remote){
  window.__syncConflictRemote=remote; const rr=stateRev(remote);
  openSheet('Данные изменились на другом устройстве',
    '<div class="fs13" style="line-height:1.55">С момента, когда вы открыли приложение, данные были изменены на другом устройстве (облачная ревизия '+rr+', ваша '+baseRev+'). Чтобы ничего не потерять, выберите действие.</div>'+
    '<div style="display:flex;flex-direction:column;gap:9px;margin-top:16px">'+
      '<button class="btn primary" data-act="sync-reload">Загрузить свежую версию (рекомендуется)</button>'+
      '<button class="btn danger" data-act="sync-overwrite">Перезаписать своей версией</button>'+
    '</div>'+
    '<div class="fs12 muted" style="margin-top:10px;line-height:1.5">«Загрузить свежую версию» отменит несохранённые локальные изменения. «Перезаписать» заменит облачную версию вашей — данные с другого устройства будут потеряны. При сомнении сначала скачайте резервную копию в «Настройках».</div>');
}

/* =========================================================

async function updateRatesFromNBRB(){
  try{
    const r=await fetch("https://api.nbrb.by/exrates/rates?periodicity=0",{cache:"no-store"});
    if(!r.ok)throw new Error("NBRB HTTP "+r.status);
    const rows=await r.json();
    const bynPerUnit={BYN:1};
    for(const row of rows){
      const code=String(row.Cur_Abbreviation||"").toUpperCase();
      const scale=Number(row.Cur_Scale)||1;
      const official=Number(row.Cur_OfficialRate);
      if(code&&Number.isFinite(official)&&official>0)bynPerUnit[code]=official/scale;
    }
    const base=baseCode();
    const baseRate=bynPerUnit[base];
    if(!baseRate)throw new Error("Базовая валюта отсутствует в курсах НБРБ");
    let changed=false;
    for(const c of S.currencies||[]){
      const n=bynPerUnit[c.code];
      if(!n)continue;
      const next=c.code===base?1:n/baseRate;
      if(Math.abs((Number(c.rate)||0)-next)>1e-12){c.rate=next;changed=true;}
    }
    const bc=curObj(base);if(bc)bc.rate=1;
    S.meta=S.meta||{};
    S.meta.ratesUpdated=new Date().toISOString();
    persist();
    return true;
  }catch(e){
    console.warn("Не удалось обновить курсы НБРБ:",e);
    return false;
  }
}

/* =========================================================

let S=null; let saveTimer=null;
let themeMedia=null,themeMediaBound=false;
let addFormTouched=new Set();
function persist(){ syncDirty=true; clearTimeout(saveTimer); saveTimer=setTimeout(()=>Store.save(S),120); }
function haptic(ms){if(navigator.vibrate){try{navigator.vibrate(ms);}catch(_){}}}
function themeMode(){return S?.settings?.theme||"auto";}
function themeIsDark(){return themeMode()==="dark"||(themeMode()==="auto"&&!!window.matchMedia?.('(prefers-color-scheme:dark)').matches);}
function applyTheme(){
  const dark=themeIsDark(),root=document.documentElement;
  if(dark)root.setAttribute("data-theme","dark");else root.removeAttribute("data-theme");
  const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.setAttribute("content",dark?"#0E1116":"#161A21");
}
function setupThemeListener(){
  if(themeMediaBound||!window.matchMedia)return;themeMediaBound=true;themeMedia=window.matchMedia('(prefers-color-scheme:dark)');
  const onChange=()=>{if(themeMode()==="auto"){applyTheme();if(S)render();}};
  if(themeMedia.addEventListener)themeMedia.addEventListener('change',onChange);else if(themeMedia.addListener)themeMedia.addListener(onChange);
}
function setTheme(mode){if(!["auto","light","dark"].includes(mode))return;S.settings.theme=mode;applyTheme();persist();render();}
function cycleTheme(){const modes=["auto","light","dark"],i=modes.indexOf(themeMode());setTheme(modes[(i+1)%modes.length]);}
function themeButtonHtml(){const dark=document.documentElement.getAttribute("data-theme")==="dark";return '<button class="theme-toggle" data-act="cycle-theme" title="Тема: '+esc(themeMode()==="auto"?'авто':themeMode()==="dark"?'тёмная':'светлая')+'" aria-label="Переключить тему">'+(dark?'☀':'☾')+'</button>';}
function resetAddFormSession(){addFormTouched.clear();}
function ensureUxState(){
  let changed=false;
  S.settings=S.settings||{};if(!["auto","light","dark"].includes(S.settings.theme)){S.settings.theme="auto";changed=true;}
  S.meta=S.meta||{};if(!S.meta.lastUsed||typeof S.meta.lastUsed!=="object"){S.meta.lastUsed={};changed=true;}
  if(!Array.isArray(S.presets)){S.presets=defaultPresets();changed=true;}
  S.ui=S.ui||{};
  if(!S.ui.view){S.ui.view="overview";changed=true;}
  if(!S.ui.txFilter){S.ui.txFilter="all";changed=true;}
  if(!S.ui.txPeriod){S.ui.txPeriod="all";changed=true;}
  if(!("txAccount" in S.ui)){S.ui.txAccount=null;changed=true;}
  if(!("txMonth" in S.ui)){S.ui.txMonth=null;changed=true;}
  if(!["month","quarter","year","all"].includes(S.ui.overviewPeriod)){S.ui.overviewPeriod="month";changed=true;}
  return changed;
}

/* =========================================================
   ВЫЧИСЛЕНИЯ
   ========================================================= */
/* --- Валюты --- */
function baseCode(){return (S.settings&&S.settings.baseCurrency)||"BYN";}
function curObj(code){return (S.currencies||[]).find(c=>c.code===code);}
function sym(code){const c=curObj(code);return c?c.symbol:(code||"");}
function rate(code){const c=curObj(code);return c?(+c.rate||1):1;}
function toBase(amt,code){return (Number(amt)||0)*rate(code||baseCode());}
const C=()=> sym(baseCode());
function fmt(n,sign,code){
  code=code||baseCode();
  const v=Math.round((Number(n)||0)*100)/100;
  const s=new Intl.NumberFormat("ru-RU",{minimumFractionDigits:2,maximumFractionDigits:2}).format(Math.abs(v));
  const pre=(sign&&v>0)?"+":(v<0?"−":"");
  const label=(code==="BYN")?"BYN":sym(code);
  return pre+s+" "+label;
}
/* --- Счета --- */
function accById(id){return (S.accounts||[]).find(a=>a.id===id);}
function entityById(id){return (S.legalEntities||[]).find(x=>x.id===id);}
function bizById(id){return (S.businesses||[]).find(b=>b.id===id);}
function entityTypeLabel(type){return type==="ooo"?"ООО":type==="cash"?"Общая касса":"ИП";}
function ownerLabel(a){if(!a)return "—";if(a.scope!=="business")return "Личный";const e=entityById(a.legalEntityId);return e?e.name:"Юрлицо не указано";}
function isPersonalAccount(a){return !!a&&a.scope!=="business";}
function isBusinessAccount(a){return !!a&&a.scope==="business";}
function isCashPoolAccount(a){return !!a&&a.scope==="business"&&(a.sharedCash===true||a.kind==="cash"&&a.legalEntityId==="le-cash");}
function isBankBusinessAccount(a){return isBusinessAccount(a)&&!isCashPoolAccount(a);}
function personalAccounts(){return activeAccounts().filter(isPersonalAccount);}
function businessAccounts(){return activeAccounts().filter(isBusinessAccount);}
function cashPoolAccounts(){return activeAccounts().filter(isCashPoolAccount);}
function businessAccountsForBiz(id,paymentMethod){
  const b=bizById(id);if(!b)return [];
  const list=activeAccounts().filter(a=>{
    if(!(a.businessIds||[]).includes(id))return false;
    if(isCashPoolAccount(a))return !!b.acceptsCash;
    return isBankBusinessAccount(a)&&a.legalEntityId===b.legalEntityId;
  });
  if(paymentMethod==="cash")return list.filter(isCashPoolAccount);
  if(paymentMethod==="bank")return list.filter(isBankBusinessAccount);
  return list;
}
function accountAvailableForBiz(a,b,paymentMethod){
  if(!a||!b||a.archived||!(a.businessIds||[]).includes(b.id))return false;
  if(paymentMethod==="cash")return !!b.acceptsCash&&isCashPoolAccount(a);
  return isBankBusinessAccount(a)&&a.legalEntityId===b.legalEntityId;
}
function txPaymentMethod(t){
  if(t&&t.paymentMethod)return t.paymentMethod;
  const a=t&&(t.account?accById(t.account):t.businessAccount?accById(t.businessAccount):null);
  return isCashPoolAccount(a)?"cash":"bank";
}
function accCur(t){const a=t&&t.account?accById(t.account):null;return a?a.currency:baseCode();}
function hasAccountTx(id){return (S.tx||[]).some(t=>t.account===id||t.businessAccount===id||t.fromAccount===id||t.toAccount===id);}
function hasBizTx(id){return (S.tx||[]).some(t=>t.biz===id||(t.type==="personal_biz_expense"&&(t.allocations||[]).some(a=>a.biz===id)));}
function hasEntityLinks(id){return (S.businesses||[]).some(b=>b.legalEntityId===id)||(S.accounts||[]).some(a=>a.legalEntityId===id);}
function activeAccounts(){return (S.accounts||[]).filter(a=>!a.archived);}
function activeBusinesses(){return (S.businesses||[]).filter(b=>!b.archived);}
function cashOpeningForAccount(a){
  if(!isCashPoolAccount(a))return 0;
  return (a.businessIds||[]).map(bizById).filter(Boolean).reduce((sum,b)=>sum+(Number(b.cashOpening)||0),0);
}
function accountBalance(id){
  const a=accById(id); if(!a)return 0;
  let v=(Number(a.opening)||0)+cashOpeningForAccount(a);
  for(const t of S.tx||[]){
    if(t.type==="transfer"||t.type==="entity_transfer"||t.type==="cash_transfer"){
      if(t.fromAccount===id)v-=Number(t.amount)||0;
      if(t.toAccount===id)v+=Number(t.toAmount)||0;
      continue;
    }
    if((t.type==="draw"||t.type==="contribution")&&t.businessAccount===id){
      const ba=Number(t.businessAmount)||0;
      if(t.type==="draw")v-=ba;
      else v+=ba;
      continue;
    }
    if(t.type==="biz_adjustment"&&t.account===id){v+=Number(t.delta)||0;continue;}
    if(t.account!==id)continue;
    if(t.type==="in"||t.type==="draw"||t.type==="biz_income"||t.type==="debt_borrow"||t.type==="debt_repayment_in")v+=Number(t.amount)||0;
    else if(t.type==="out"||t.type==="contribution"||t.type==="biz_expense"||t.type==="personal_biz_expense"||t.type==="debt_issue"||t.type==="debt_repayment_out")v-=Number(t.amount)||0;
    else if(t.type==="account_adjustment")v+=Number(t.delta)||0;
  }
  return v;
}
function accUsedCredit(id){const b=accountBalance(id);return b<0?-b:0;}
function accAvailable(id){const a=accById(id);return accountBalance(id)+(Number(a.limit)||0);}
function accKindLabel(k){return k==="credit"?"кредитка / овердрафт":k==="cash"?"наличные":"расчётный счёт / карта";}

function monthKey(d){return (d||"").slice(0,7);}
function inThisMonth(d){return monthKey(d)===monthKey(TODAY());}

/* Личный итог — только личные счета. Банковские деньги бизнеса и общая касса считаются отдельно. */
function personalBalance(){
  return (S.accounts||[]).filter(isPersonalAccount).reduce((s,a)=>s+toBase(accountBalance(a.id),a.currency),0);
}
function businessBankBalance(){
  return (S.accounts||[]).filter(isBankBusinessAccount).reduce((s,a)=>s+toBase(accountBalance(a.id),a.currency),0);
}
function businessCashBalance(){
  return (S.accounts||[]).filter(isCashPoolAccount).reduce((s,a)=>s+toBase(accountBalance(a.id),a.currency),0);
}
function totalCreditUsed(){return (S.accounts||[]).filter(isPersonalAccount).reduce((s,a)=>s+toBase(accUsedCredit(a.id),a.currency),0);}
function totalAvailable(){return personalAccounts().reduce((s,a)=>s+toBase(accAvailable(a.id),a.currency),0);}

function bizChannelBalance(id,paymentMethod){
  const b=bizById(id);let v=paymentMethod==="cash"?(Number(b?.cashOpening)||0):0;
  for(const t of S.tx||[]){if(t.biz!==id)continue;
    const acc=t.account?accById(t.account):null,bacc=t.businessAccount?accById(t.businessAccount):null;
    if(t.type==="cash_transfer"){
      const from=accById(t.fromAccount),to=accById(t.toAccount);
      if(paymentMethod==="cash"){
        if(isCashPoolAccount(from))v-=toBase(t.amount,from.currency);
        if(isCashPoolAccount(to))v+=toBase(t.toAmount,to.currency);
      }else{
        if(isBankBusinessAccount(from))v-=toBase(t.amount,from.currency);
        if(isBankBusinessAccount(to))v+=toBase(t.toAmount,to.currency);
      }
      continue;
    }
    const method=txPaymentMethod(t);if(method!==paymentMethod)continue;
    if(t.type==="biz_income")v+=toBase(t.amount,acc?acc.currency:baseCode());
    else if(t.type==="biz_expense")v-=toBase(t.amount,acc?acc.currency:baseCode());
    else if(t.type==="draw")v-=toBase(t.businessAmount||t.amount,bacc?bacc.currency:(acc?acc.currency:baseCode()));
    else if(t.type==="contribution")v+=toBase(t.businessAmount||t.amount,bacc?bacc.currency:(acc?acc.currency:baseCode()));
    else if(t.type==="biz_adjustment")v+=Number(t.delta)||0;
  }
  return v;
}
function bizCashBalance(id){return bizChannelBalance(id,"cash");}
function bizCashlessBalance(id){return bizChannelBalance(id,"bank");}
function bizBalance(id){return bizCashBalance(id)+bizCashlessBalance(id);}
function bizTotalBalance(){return businessBankBalance()+businessCashBalance();}

/* Все агрегаты — в базовой валюте (каждая операция конвертируется по валюте счёта) */
function sumTx(pred){return S.tx.filter(pred).reduce((s,t)=>s+toBase(t.amount, t.account?accCur(t):baseCode()),0);}
function dateKeyLocal(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function periodRange(period){
  if(period==="all")return {from:null,to:null};
  const now=new Date(TODAY()+"T12:00:00");let from,to;
  if(period==="quarter"){
    const q=Math.floor(now.getMonth()/3)*3;from=new Date(now.getFullYear(),q,1);to=new Date(now.getFullYear(),q+3,1);
  }else if(period==="year"){
    from=new Date(now.getFullYear(),0,1);to=new Date(now.getFullYear()+1,0,1);
  }else{
    from=new Date(now.getFullYear(),now.getMonth(),1);to=new Date(now.getFullYear(),now.getMonth()+1,1);
  }
  return {from:dateKeyLocal(from),to:dateKeyLocal(to)};
}
function inPeriod(date,period){const r=periodRange(period);return !r.from||(date>=r.from&&date<r.to);}
function periodAgg(period){
  return {
    income:sumTx(t=>t.type==="in"&&inPeriod(t.date,period)),
    expense:sumTx(t=>t.type==="out"&&inPeriod(t.date,period)),
    draw:sumTx(t=>t.type==="draw"&&t.cat!=="Возмещение личных расходов"&&inPeriod(t.date,period)),
    contribution:sumTx(t=>t.type==="contribution"&&inPeriod(t.date,period)),
  };
}
function monthAgg(){return periodAgg("month");}
function netDrawPeriod(period){const a=periodAgg(period);return a.draw-a.contribution;}
function realIncomePeriod(period){const a=periodAgg(period);return a.income+(a.draw-a.contribution);}
function netDrawMonth(){return netDrawPeriod("month");}
function realIncomeMonth(){return realIncomePeriod("month");} // личный + чистый вывод

function debtCurrency(d){return d&&d.currency||baseCode();}
function debtRemaining(d){return (Number(d.amount)||0)-(d.repaid||[]).reduce((s,r)=>s+(Number(r.amount)||0),0);}
function debtBaseRemaining(d){return toBase(Math.max(0,debtRemaining(d)),debtCurrency(d));}
function owedToMe(){return S.debts.filter(d=>d.dir==="in").reduce((s,d)=>s+debtBaseRemaining(d),0);}
function iOwe(){return S.debts.filter(d=>d.dir==="out").reduce((s,d)=>s+debtBaseRemaining(d),0);}
function isExternalDebt(d){return d?.kind!=="owner_reimbursement";}
function externalOwedToMe(){return S.debts.filter(d=>d.dir==="in"&&isExternalDebt(d)).reduce((s,d)=>s+debtBaseRemaining(d),0);}
function externalIOwe(){return S.debts.filter(d=>d.dir==="out"&&isExternalDebt(d)).reduce((s,d)=>s+debtBaseRemaining(d),0);}
function netWorth(){return personalBalance()+owedToMe()-iOwe();}
function personalBizExpenseForBiz(id){
  return (S.tx||[]).filter(t=>t.type==="personal_biz_expense").reduce((sum,t)=>{
    const a=(t.allocations||[]).find(x=>x.biz===id),acc=accById(t.account);
    return sum+(a?toBase(a.amount,acc?acc.currency:baseCode()):0);
  },0);
}

function bizStats(id){
  return {
    income: sumTx(t=>t.type==="biz_income"&&t.biz===id),
    expense: sumTx(t=>t.type==="biz_expense"&&t.biz===id)+personalBizExpenseForBiz(id),
    draw: sumTx(t=>t.type==="draw"&&t.cat!=="Возмещение личных расходов"&&t.biz===id),
    contribution: sumTx(t=>t.type==="contribution"&&t.biz===id),
    cash: bizCashBalance(id),
    cashless: bizCashlessBalance(id),
    balance: bizBalance(id),
  };
}
function reconcile(){
  const issues=[]; const EPS=0.01;
  for(const pool of cashPoolAccounts()){
    const poolBal=toBase(accountBalance(pool.id),pool.currency);
    const perBiz=(pool.businessIds||[]).reduce((sum,id)=>sum+bizCashBalance(id),0);
    if(Math.abs(poolBal-perBiz)>EPS)
      issues.push({name:"Касса «"+pool.name+"»",a:poolBal,b:perBiz,diff:poolBal-perBiz});
  }
  const tot=bizTotalBalance(),split=businessBankBalance()+businessCashBalance();
  if(Math.abs(tot-split)>EPS)
    issues.push({name:"Итог бизнеса (банк+касса)",a:tot,b:split,diff:tot-split});
  return issues;
}

/* месячные ряды для графиков (последние 6 месяцев) */
function monthlySeries(){
  const out=[]; const now=new Date();
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const key=d.toISOString().slice(0,7);
    const income=sumTx(t=>t.type==="in"&&monthKey(t.date)===key);
    const expense=sumTx(t=>t.type==="out"&&monthKey(t.date)===key);
    const net=income+ (sumTx(t=>t.type==="draw"&&monthKey(t.date)===key)-sumTx(t=>t.type==="contribution"&&monthKey(t.date)===key)) - expense;
    out.push({key,label:d.toLocaleDateString("ru-RU",{month:"short"}),income,expense,net});
  }
  return out;
}
/* средний чистый личный поток за месяц (для прогноза) */
function avgMonthlyNet(){
  const s=monthlySeries().filter(m=>m.income||m.expense);
  if(!s.length)return 0;
  return s.reduce((a,m)=>a+m.net,0)/s.length;
}

      '</div>'+

      (points.length?'<div class="fs12 muted" style="margin-top:7px">Точки: '+points.map(b=>esc(b.name)).join(' · ')+'</div>':'')+
      (isCredit?'<div style="margin-top:11px"><div class="prog"><span style="width:'+pctUsed+'%;background:var(--liab)"></span></div><div class="fs12 muted" style="display:flex;justify-content:space-between;margin-top:6px"><span>Долг: '+fmt(used,false,a.currency)+'</span><span>Доступно: '+fmt(avail,false,a.currency)+'</span></div></div>':'')+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn sm" data-act="edit-acc" data-id="'+a.id+'">'+svg(I.edit)+'Изменить</button>'+(!a.archived?'<button class="btn sm" data-act="adjust-acc" data-id="'+a.id+'">Сверить остаток</button>':'')+archiveAction+'</div>'+
    '</div>';

    '<div class="card pad" style="margin-bottom:16px"><div class="two" style="grid-template-columns:repeat(auto-fit,minmax(170px,1fr))">'+
      '<div><div class="eyebrow">Личные деньги</div><div class="mono" style="font-size:26px;font-weight:700;color:var(--personal)">'+fmt(personalBalance())+'</div></div>'+
      '<div><div class="eyebrow">Безнал бизнеса</div><div class="mono" style="font-size:26px;font-weight:700;color:var(--biz)">'+fmt(businessBankBalance())+'</div></div>'+
      '<div><div class="eyebrow">Наличные студий</div><div class="mono" style="font-size:26px;font-weight:700;color:var(--goal)">'+fmt(businessCashBalance())+'</div></div>'+

    '</div></div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div class="eyebrow">СЧЕТА · '+activeCount+(archivedCount?' · В АРХИВЕ '+archivedCount:'')+'</div><button class="btn sm" data-act="add-acc">'+svg(I.add)+'Добавить счёт</button></div>'+

/* =========================================================

function dueLabel(due){
  if(!due)return {txt:"без срока",cls:""};
  const diff=Math.round((new Date(due)-new Date(TODAY()))/86400000);
  if(diff<0)return {txt:"просрочено на "+Math.abs(diff)+" дн.",cls:"due-over"};
  if(diff===0)return {txt:"сегодня",cls:"due-soon"};
  if(diff<=7)return {txt:"через "+diff+" дн.",cls:"due-soon"};
  return {txt:"до "+fmtDate(due),cls:""};
}
function debtCard(d){
  const rem=debtRemaining(d); const paid=(Number(d.amount)||0)-rem,code=debtCurrency(d);
  const p=Math.min(100,Math.round(paid/(Number(d.amount)||1)*100));
  const dd=dueLabel(d.due);
  const color=d.dir==="in"?"var(--asset)":"var(--liab)";
  const bg=d.dir==="in"?"var(--asset-bg)":"var(--liab-bg)";
  return '<div class="card pad" style="margin-bottom:12px">'+
    '<div style="display:flex;align-items:flex-start;gap:12px">'+
      '<div class="avatar" style="background:'+bg+';color:'+color+'">'+(d.who[0]||"?").toUpperCase()+'</div>'+
      '<div style="flex:1;min-width:0">'+
        '<div style="font-weight:600;font-family:var(--disp)">'+esc(d.who)+'</div>'+
        '<div class="fs12 muted">'+(d.note?esc(d.note)+" · ":"")+(d.kind==="owner_reimbursement"?"оплачено ":(d.dir==="in"?"выдано ":"получено "))+fmtDate(d.date)+' · <span class="'+dd.cls+'">'+dd.txt+'</span></div>'+
      '</div>'+
      '<div style="text-align:right"><div class="num" style="font-weight:700;font-size:16px;color:'+color+'">'+fmt(rem,false,code)+'</div>'+
      (paid>0?'<div class="fs12 muted num">из '+fmt(d.amount,false,code)+'</div>':'')+'</div>'+
    '</div>'+
    (paid>0?'<div class="prog" style="margin-top:10px"><span style="width:'+p+'%;background:'+color+'"></span></div>':'')+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:11px">'+
      (rem>0?'<button class="btn sm" data-act="repay" data-id="'+d.id+'">'+(d.dir==="in"?"Отметить возврат":"Отметить платёж")+'</button><button class="btn sm ghost" data-act="repay" data-id="'+d.id+'" data-frac="0.25">25%</button><button class="btn sm ghost" data-act="repay" data-id="'+d.id+'" data-frac="0.5">50%</button><button class="btn sm ghost" data-act="repay" data-id="'+d.id+'" data-frac="1">Остаток</button>':'<span class="chip c-in">✓ Закрыт</span>')+
      '<button class="btn sm ghost" data-act="edit-debt" data-id="'+d.id+'">'+svg(I.edit)+'</button>'+
      '<button class="btn sm ghost danger" data-act="del-debt" data-id="'+d.id+'">'+svg(I.trash)+'</button>'+
    '</div>'+
  '</div>';
}
function viewDebts(){
  const inD=S.debts.filter(d=>d.dir==="in");
  const outD=S.debts.filter(d=>d.dir==="out");
  const colIn=inD.length?inD.map(debtCard).join(""):'<div class="empty compact"><b>Вам никто не должен</b></div>';
  const colOut=outD.length?outD.map(debtCard).join(""):'<div class="empty compact"><b>У вас нет долгов</b></div>';

/* =========================================================
   ВИД: ПРОГНОЗ
   ========================================================= */
function viewForecast(){
  const pb=personalBalance();
  const avg=avgMonthlyNet();
  // прогноз баланса на 6 месяцев с учётом плановых возвратов долгов
  const pts=[{label:"сейчас",val:pb}];
  let run=pb; const now=new Date();
  const months=[];
  for(let i=1;i<=6;i++){
    const md=new Date(now.getFullYear(),now.getMonth()+i,1);
    const key=md.toISOString().slice(0,7);
    // плановые движения долгов в этом месяце
    let debtFlow=0;
    for(const d of S.debts){ const rem=debtRemaining(d); if(rem<=0||!d.due)continue;
      if(monthKey(d.due)===key){ const baseRem=toBase(rem,debtCurrency(d));debtFlow+= d.dir==="in"?baseRem:-baseRem; }
    }
    run=run+avg+debtFlow;
    pts.push({label:md.toLocaleDateString("ru-RU",{month:"short"}),val:run});
    months.push({key,label:md.toLocaleDateString("ru-RU",{month:"long"}),avg,debtFlow});
  }
  const line=lineChart(pts);
  // таблица предстоящих движений по долгам
  const debtRows=S.debts.map(d=>({d,rem:debtRemaining(d)})).filter(x=>x.rem>0&&x.d.due)
    .sort((a,b)=>a.d.due.localeCompare(b.d.due))
    .map(({d,rem})=>{const dd=dueLabel(d.due);return '<tr><td data-label="Контрагент">'+esc(d.who)+'</td><td data-label="Тип"><span class="chip '+(d.dir==="in"?"c-biz_income":"c-out")+'">'+(d.dir==="in"?"поступление":"платёж")+'</span></td><td class="fs13 '+dd.cls+'" data-label="Срок">'+fmtDate(d.due)+' · '+dd.txt+'</td><td class="num '+(d.dir==="in"?"blue":"neg")+'" data-label="Сумма" style="font-weight:600">'+(d.dir==="in"?"+":"−")+fmt(rem,false,debtCurrency(d)).replace("−","")+'</td></tr>';}).join("");

  const in1=pb+avg, in3=pb+avg*3, in6=run;
  return head("Прогноз","Оценка будущего баланса по вашим средним показателям и запланированным возвратам долгов.")+
  '<div class="stats ov-kpis" style="margin-bottom:16px">'+
    statCard("Через 1 месяц",fmt(pb+avg),"оценка",in1>=pb?"i-in":"i-liab",I.forecast)+
    statCard("Через 3 месяца",fmt(in3),"оценка",in3>=pb?"i-in":"i-liab",I.forecast)+
    statCard("Через 6 месяцев",fmt(in6),"с учётом долгов",in6>=pb?"i-in":"i-liab",I.forecast)+
    statCard("Средний поток / мес",fmt(avg,true),"доходы − расходы",avg>=0?"i-in":"i-liab",I.in)+
  '</div>'+
  '<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Прогноз личного баланса</h3><div class="fs12 muted">6 месяцев вперёд</div></div><div class="card-b">'+line+
    ''+
  '</div></div>'+
  '<div class="card"><div class="card-h"><h3>Плановые движения по долгам</h3></div>'+
    (debtRows?'<table><thead><tr><th>Контрагент</th><th>Тип</th><th>Срок</th><th class="num">Сумма</th></tr></thead><tbody>'+debtRows+'</tbody></table>':'<div class="empty compact"><span class="fs13">Нет долгов со сроком возврата.</span></div>')+
  '</div>';
}

function viewGoals(){

    else eta="нужен положительный поток";
    return '<div class="card pad" style="margin-bottom:14px">'+

  const ratesDate=S.meta&&S.meta.ratesUpdated?new Date(S.meta.ratesUpdated):null;

/* =========================================================

   ========================================================= */
function barChart(series){
  const W=560,H=180,pad=28,bw=Math.min(46,(W-pad*2)/series.length-14);
  const max=Math.max(1,...series.map(s=>Math.max(Math.abs(s.income),Math.abs(s.expense))));
  const zeroY=H-pad-30;
  const scale=(zeroY-14)/max;
  let bars="";
  series.forEach((s,i)=>{
    const x=pad+i*((W-pad*2)/series.length)+((W-pad*2)/series.length-bw*2-6)/2;
    const ih=s.income*scale, eh=s.expense*scale;
    let content='<title>'+esc(monthLabel(s.key))+'</title>';
    content+='<rect x="'+x+'" y="'+(zeroY-ih)+'" width="'+bw+'" height="'+Math.max(1,ih)+'" rx="3" fill="var(--personal)" opacity="0.85"/>';
    content+='<rect x="'+(x+bw+6)+'" y="'+(zeroY-eh)+'" width="'+bw+'" height="'+Math.max(1,eh)+'" rx="3" fill="var(--liab)" opacity="0.75"/>';
    content+='<text x="'+(x+bw+3)+'" y="'+(H-16)+'" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--mono)">'+s.label+'</text>';
    if(s.net!==0)content+='<text x="'+(x+bw+3)+'" y="'+(zeroY-Math.max(ih,eh)-6)+'" text-anchor="middle" font-size="9.5" fill="'+(s.net>=0?'var(--personal)':'var(--liab)')+'" font-family="var(--mono)" font-weight="600">'+(s.net>=0?'+':'−')+kfmt(Math.abs(s.net))+'</text>';
    bars+='<g class="chart-drill" data-act="drill-month" data-month="'+s.key+'">'+content+'</g>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">'+
    '<line x1="'+pad+'" y1="'+zeroY+'" x2="'+(W-pad)+'" y2="'+zeroY+'" stroke="var(--line)"/>'+bars+
    '</svg>'+ 
    '<div style="display:flex;gap:16px;margin-top:6px;font-size:12px" class="muted"><span><span style="display:inline-block;width:9px;height:9px;background:var(--personal);border-radius:2px;margin-right:5px"></span>Доходы</span><span><span style="display:inline-block;width:9px;height:9px;background:var(--liab);border-radius:2px;margin-right:5px"></span>Расходы</span></div>';
}
function lineChart(pts){
  const W=620,H=200,pad=40;
  const vals=pts.map(p=>p.val);
  const min=Math.min(...vals,0),max=Math.max(...vals,1);
  const rng=(max-min)||1;
  const X=i=>pad+i*((W-pad*2)/(pts.length-1));
  const Y=v=>pad/2+ (H-pad-pad/2)*(1-(v-min)/rng);
  let path="",area="",dots="",labels="";
  pts.forEach((p,i)=>{
    const x=X(i),y=Y(p.val);
    path+=(i?"L":"M")+x+" "+y+" ";
    dots+='<circle cx="'+x+'" cy="'+y+'" r="3.5" fill="var(--personal)"/>';
    labels+='<text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="var(--mono)">'+p.label+'</text>';
    labels+='<text x="'+x+'" y="'+(y-9)+'" text-anchor="middle" font-size="9.5" fill="var(--ink-2)" font-family="var(--mono)" font-weight="600">'+kfmt(p.val)+'</text>';
  });
  area="M"+X(0)+" "+Y(pts[0].val)+" "+pts.map((p,i)=>"L"+X(i)+" "+Y(p.val)).join(" ")+" L"+X(pts.length-1)+" "+Y(min)+" L"+X(0)+" "+Y(min)+" Z";
  const zeroY=Y(0);
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">'+
    '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--personal)" stop-opacity="0.18"/><stop offset="1" stop-color="var(--personal)" stop-opacity="0"/></linearGradient></defs>'+
    (min<0?'<line x1="'+pad+'" y1="'+zeroY+'" x2="'+(W-pad)+'" y2="'+zeroY+'" stroke="var(--line-strong)" stroke-dasharray="4 4"/>':'')+
    '<path d="'+area+'" fill="url(#g)"/>'+
    '<path d="'+path+'" fill="none" stroke="var(--personal)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'+
    dots+labels+'</svg>';
}
function kfmt(n){const a=Math.abs(n);if(a>=1e6)return(n/1e6).toFixed(1).replace(".0","")+"м";if(a>=1e3)return Math.round(n/1e3)+"к";return Math.round(n);}

function reconciliationCategoryOptions(items,current){
  return (items||[]).map(x=>'<option '+(x===current?'selected':'')+'>'+esc(x)+'</option>').join('');
}
function reconciliationBusinesses(a){
  return (a?.businessIds||[]).map(bizById).filter(b=>b&&!b.archived&&(isCashPoolAccount(a)?b.acceptsCash:b.legalEntityId===a.legalEntityId));
}
function reconciliationDelta(a){
  const target=Number(mval('adj-target'));return Number.isFinite(target)?target-accountBalance(a.id):NaN;
}
function reconciliationDirection(a,delta){
  const positive=delta>0,business=isBusinessAccount(a);
  return {positive,type:business?(positive?'biz_income':'biz_expense'):(positive?'in':'out'),categories:business?(positive?S.categories.bizIn:S.categories.bizOut):(positive?S.categories.in:S.categories.out)};
}
function reconciliationSummary(a,delta){
  const box=document.getElementById('adj-preview');if(!box)return;
  if(!Number.isFinite(delta)){box.innerHTML='<span class="neg">Введите фактический остаток.</span>';return;}
  const target=accountBalance(a.id)+delta,cls=delta>0?'pos':delta<0?'neg':'muted',sign=delta>0?'+':'';
  box.innerHTML='<div class="kpi-line"><span class="muted">Сейчас в PFinance</span><b class="mono">'+fmt(accountBalance(a.id),false,a.currency)+'</b></div>'+ 
    '<div class="kpi-line"><span class="muted">Фактически</span><b class="mono">'+fmt(target,false,a.currency)+'</b></div>'+ 
    '<div class="kpi-line"><span class="muted">Разница</span><b class="mono '+cls+'">'+(delta===0?fmt(0,false,a.currency):sign+fmt(delta,false,a.currency))+'</b></div>';
}
function distributeCashReconciliation(a,force){
  const delta=reconciliationDelta(a),amount=Math.abs(Number.isFinite(delta)?delta:0),fields=[...document.querySelectorAll('.cash-reconcile-amount')];
  if(!fields.length)return;
  const hasManual=fields.some(x=>x.dataset.manual==='1');
  if(force||!hasManual){
    const cents=Math.round(amount*100),base=Math.floor(cents/fields.length),rest=cents-base*fields.length;
    fields.forEach((x,i)=>{x.value=((base+(i<rest?1:0))/100).toFixed(2);delete x.dataset.manual;});
  }
  const allocated=fields.reduce((sum,x)=>sum+(Number(x.value)||0),0),left=amount-allocated,summary=document.getElementById('adj-allocation-summary');
  if(summary)summary.innerHTML='Распределено: <b class="mono">'+fmt(allocated,false,a.currency)+'</b> · Осталось: <b class="mono '+(Math.abs(left)<=0.01?'pos':'neg')+'">'+fmt(left,false,a.currency)+'</b>';
}
function updateReconciliationForm(forceDistribution=false){
  const a=accById(window.__reconcileAccountId);if(!a)return;
  const delta=reconciliationDelta(a),mode=mval('adj-mode')||'technical',recognized=document.getElementById('adj-recognized-wrap');
  reconciliationSummary(a,delta);
  if(recognized)recognized.classList.toggle('hidden',mode!=='recognized'||!Number.isFinite(delta)||Math.abs(delta)<0.005);
  if(Number.isFinite(delta)&&Math.abs(delta)>=0.005){
    const dir=reconciliationDirection(a,delta),cat=document.getElementById('adj-cat');
    if(cat){const prev=cat.value;cat.innerHTML=reconciliationCategoryOptions(dir.categories,dir.categories.includes(prev)?prev:dir.categories[0]);}
    const hint=document.getElementById('adj-mode-hint');if(hint)hint.textContent=mode==='technical'?'Изменится только остаток счёта; прибыль и отчёты не изменятся.':(dir.positive?'Разница будет отражена как доход.':'Разница будет отражена как расход.');
  }
  if(isCashPoolAccount(a))distributeCashReconciliation(a,forceDistribution);
}

function saveReconciliation(a){
  const target=Number(mval('adj-target')),current=accountBalance(a.id);if(!Number.isFinite(target)){toast('Введите фактический остаток');return false;}
  const delta=target-current;if(Math.abs(delta)<0.005){toast('Остаток уже совпадает');return false;}
  const mode=mval('adj-mode')||'technical',date=mval('adj-date')||TODAY(),note=mval('adj-note').trim(),created=[];
  if(isCashPoolAccount(a)){
    const allocations=[...document.querySelectorAll('.cash-reconcile-amount')].map(x=>({biz:x.dataset.biz,amount:Number(x.value)||0})).filter(x=>x.amount>0),sum=allocations.reduce((s,x)=>s+x.amount,0);
    if(!allocations.length){toast('Распределите разницу по студиям');return false;}
    if(Math.abs(sum-Math.abs(delta))>0.01){toast('Распределение должно совпадать с разницей');return false;}
    const dir=reconciliationDirection(a,delta),cat=mval('adj-cat')||(dir.categories||[])[0]||'Прочее';
    for(const part of allocations){
      const b=bizById(part.biz);if(!b||!accountAvailableForBiz(a,b,'cash')){toast('Проверьте распределение по студиям');return false;}
      const t=mode==='recognized'?{id:uid(),type:dir.type,biz:b.id,account:a.id,paymentMethod:'cash',amount:part.amount,cat,date,note}:{id:uid(),type:'biz_adjustment',biz:b.id,account:a.id,paymentMethod:'cash',amount:part.amount,delta:(delta>0?1:-1)*part.amount,cat:'Корректировка наличных',date,note};
      created.push(t);
    }
  }else if(mode==='recognized'){
    const dir=reconciliationDirection(a,delta),cat=mval('adj-cat')||(dir.categories||[])[0]||'Прочее',t={id:uid(),type:dir.type,account:a.id,amount:Math.abs(delta),cat,date,note};

      const b=bizById(mval('adj-biz'));if(!b||!accountAvailableForBiz(a,b,'bank')){toast('Выберите точку, связанную со счётом');return false;}
      t.biz=b.id;t.paymentMethod='bank';
    }
    created.push(t);
  }else created.push({id:uid(),type:'account_adjustment',account:a.id,amount:Math.abs(delta),delta,cat:'Корректировка баланса',date,note});
  S.tx.push(...created);persist();render();haptic(16);const ids=new Set(created.map(t=>t.id));
  showUndo('Сверка сохранена · '+(delta>0?'+':'')+fmt(delta,false,a.currency),()=>{S.tx=S.tx.filter(t=>!ids.has(t.id));persist();});
  return true;
}

function completeSavedTx(t,message,saveCtx){
  rememberLastUsed(t.type);S.meta=S.meta||{};S.meta.addType=t.type;S.meta.lastEntryDate=TODAY();
  const amountInput=document.getElementById('f-amount');if(amountInput)amountInput.value='0';
  const draft=currentPresetDraft();if(draft)S.meta.addDraft=draft;
  const debtIds=[...(t.debtIds||[])],after=saveCtx?.account?accountBalance(saveCtx.account.id):null;
  persist();if(t.type==='personal_biz_expense')distributePbe();updateCompactAddChrome(false);
  if(saveCtx?.account&&after!=null)animateCompactBalance(saveCtx.balance,after,saveCtx.account);else updateCompactAddChrome();
  showUndo(message,()=>{S.tx=S.tx.filter(x=>x.id!==t.id);if(debtIds.length)S.debts=S.debts.filter(d=>!debtIds.includes(d.id));persist();});
}
function saveTx(){
  const type=document.getElementById("f-type").value,amount=+mval("f-amount");
  if(!amount||amount<=0){toast("Введите сумму больше нуля");return;}
  const saveCtx=compactBalanceContext();
  const date=mval("f-date")||TODAY(),note=mval("f-note").trim();
  if(type==="transfer"||type==="entity_transfer"||type==="cash_transfer"){
    const {from,to,toAmount}=transferAmounts();
    if(!from||!to||from.archived||to.archived||from.id===to.id){toast("Выберите два разных активных счёта");return;}
    if(type==="transfer"&&!sameAccountOwner(from,to)){toast("Обычный перевод возможен только внутри одного владельца");return;}
    if(type==="entity_transfer"&&(!isBankBusinessAccount(from)||!isBankBusinessAccount(to)||from.legalEntityId===to.legalEntityId)){toast("Выберите банковские счета двух разных юридических лиц");return;}
    let biz=null;
    if(type==="cash_transfer"){
      biz=bizById(mval("f-biz"));
      const valid=biz&&accountAvailableForBiz(from,biz,isCashPoolAccount(from)?'cash':'bank')&&accountAvailableForBiz(to,biz,isCashPoolAccount(to)?'cash':'bank');
      if(!valid||isCashPoolAccount(from)===isCashPoolAccount(to)){toast("Выберите общую кассу и банковский счёт выбранной студии");return;}
    }
    const t={id:uid(),type,biz:biz?.id,fromAccount:from.id,toAccount:to.id,amount,toAmount,cat:type==="transfer"?"Перевод между счетами":type==="cash_transfer"?"Инкассация":mval("f-cat"),date,note,rateFrom:rate(from.currency),rateTo:rate(to.currency)};
    haptic(16);pulseCompactAmount();S.tx.push(t);completeSavedTx(t,"Перемещение сохранено · "+fmt(amount,false,from.currency),saveCtx);return;
  }
  if(type==="personal_biz_expense"){
    const pa=accById(mval("f-acc"));if(!pa||pa.archived||!isPersonalAccount(pa)){toast("Добавьте и выберите личный счёт");return;}
    const allocations=selectedPbeAllocations(),allocated=allocations.reduce((s,a)=>s+a.amount,0);
    if(!allocations.length){toast("Выберите хотя бы одну точку бизнеса");return;}
    if(Math.abs(allocated-amount)>0.01){toast("Распределённая сумма должна совпадать с общей");return;}
    const settlement=mval("f-pbe-settlement")||"reimburse",id=uid(),debtIds=[];
    const t={id,type,account:pa.id,amount,allocations,settlement,cat:mval("f-cat"),date,note};
    if(settlement==="reimburse"){
      const byEntity={};for(const a of allocations){const b=bizById(a.biz);if(!b)continue;byEntity[b.legalEntityId]=(byEntity[b.legalEntityId]||0)+a.amount;}
      for(const [legalEntityId,sum] of Object.entries(byEntity)){const entity=entityById(legalEntityId),did=uid();debtIds.push(did);S.debts.push({id:did,dir:"in",who:(entity?.name||"Бизнес")+" · возмещение личных расходов",amount:sum,currency:pa.currency,date,due:mval("f-pbe-due"),note:"Личная оплата: "+(mval("f-cat")||"Расход бизнеса")+(note?" · "+note:""),repaid:[],kind:"owner_reimbursement",legalEntityId,sourceTxId:id});}
      t.debtIds=debtIds;
    }
    haptic(16);pulseCompactAmount();S.tx.push(t);completeSavedTx(t,"Личная оплата распределена · "+fmt(amount,false,pa.currency),saveCtx);return;
  }
  const t={id:uid(),type,amount,cat:mval("f-cat"),date,note};
  if(["draw","contribution","biz_income","biz_expense"].includes(type)){
    t.biz=mval("f-biz");const b=bizById(t.biz),paymentMethod=selectedPaymentMethod(),ba=accById(mval("f-biz-acc"));
    if(!b){toast("Выберите точку бизнеса");return;}
    if(paymentMethod==='cash'&&!b.acceptsCash){toast("Эта точка не принимает наличные");return;}
    if(!accountAvailableForBiz(ba,b,paymentMethod)){toast(paymentMethod==='cash'?"Выберите общую кассу":"Выберите банковский счёт, связанный с этой точкой");return;}
    t.paymentMethod=paymentMethod;
    if(type==="biz_income"||type==="biz_expense")t.account=ba.id;
    else{
      const pa=accById(mval("f-acc"));if(!pa||pa.archived||!isPersonalAccount(pa)){toast("Добавьте и выберите личный счёт");return;}
      t.account=pa.id;t.businessAccount=ba.id;t.businessAmount=pa.currency===ba.currency?amount:toBase(amount,pa.currency)/rate(ba.currency);
    }
  }else if(type==="in"||type==="out"){
    const pa=accById(mval("f-acc"));if(!pa||pa.archived||!isPersonalAccount(pa)){toast("Добавьте и выберите личный счёт");return;}t.account=pa.id;
  }
  haptic(16);pulseCompactAmount();S.tx.push(t);completeSavedTx(t,"Операция сохранена · "+fmt(amount,false,accById(t.account)?.currency||baseCode()),saveCtx);
}

function downloadJSON(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download="finance-backup-"+TODAY()+".json";a.click();URL.revokeObjectURL(url);
  toast("Копия скачана");
}
function importJSON(){
  const inp=document.createElement("input");inp.type="file";inp.accept=".json";
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const data=JSON.parse(r.result);if(!confirm("Загрузка из копии заменит все текущие данные в приложении. Продолжить?"))return;S=data;ensureBusinessModel();ensureUxState();S.ui={view:"overview",txFilter:"all",txPeriod:"all",txAccount:null,txMonth:null,overviewPeriod:"month"};applyTheme();persist();render();toast("Данные загружены и обновлены");}catch(err){toast("Не удалось прочитать файл");}};
    r.readAsText(f);};
  inp.click();
}

  if(e.target.id==="f-biz")refreshAddForm();
  if(e.target.id==="f-from-acc"||e.target.id==="f-to-acc"){ensureTransferAccounts();updateAmountCurrencyLabel();updateTransferPreview();}
  if(e.target.classList?.contains("pbe-check")){document.querySelectorAll(".pbe-amount").forEach(x=>delete x.dataset.manual);distributePbe();}
  if(e.target.id==="f-pbe-settlement")updatePbeSettlement();
  if(["d-dir","d-currency","d-account","d-move"].includes(e.target.id))updateDebtMoveForm(true);
  if(["r-account","r-move"].includes(e.target.id)&&window.__currentRepayDebt)updateRepayMoveForm(window.__currentRepayDebt,true);
  if(e.target.id==="adj-mode"||e.target.id==="adj-biz")updateReconciliationForm(false);
  if(e.target.dataset&&e.target.dataset.act==="rate-input"){
    const c=curObj(e.target.dataset.code);if(c){c.rate=+e.target.value||1;persist();render();}
  }
  if(e.target.id&&e.target.id.startsWith("f-"))captureAddDraft();
});

document.addEventListener("input",e=>{
  const type=document.getElementById("f-type")?.value;
  if(e.target.id&&e.target.id.startsWith("f-")&&e.isTrusted)addFormTouched.add(e.target.id);
  if(e.target.id==="f-amount"&&["transfer","entity_transfer","cash_transfer"].includes(type))updateTransferPreview();
  if(e.target.id==="f-amount"&&type==="personal_biz_expense"){
    const manual=[...document.querySelectorAll('.pbe-amount')].some(x=>x.dataset.manual==='1');if(manual)updatePbeSummary();else distributePbe();
  }
  if(e.target.classList?.contains("pbe-amount")){e.target.dataset.manual='1';updatePbeSummary();}
  if(e.target.id==="d-amount")updateDebtMoveForm(false);
  if(e.target.id==="d-account-amount")e.target.dataset.manual='1';
  if(e.target.id==="r-amt"&&window.__currentRepayDebt)updateRepayMoveForm(window.__currentRepayDebt,false);
  if(e.target.id==="r-account-amount")e.target.dataset.manual='1';
  if(e.target.id==="adj-target")updateReconciliationForm(true);
  if(e.target.classList?.contains("cash-reconcile-amount")){e.target.dataset.manual='1';updateReconciliationForm(false);}
  if(e.target.id&&e.target.id.startsWith("f-"))captureAddDraft();
  if(e.target.id==="f-amount")updateCompactAddChrome();
});

document.addEventListener("keydown",e=>{
  if(!S||S.ui.view!=="add"||!document.getElementById("f-amount")||document.getElementById("modal-root")?.innerHTML)return;
  const tag=(e.target?.tagName||"").toLowerCase();if(["input","select","textarea"].includes(tag))return;
  if(/^[0-9]$/.test(e.key)){e.preventDefault();compactPressAmount(e.key);}
  else if(e.key==="."||e.key===","){e.preventDefault();compactPressAmount(".");}
  else if(e.key==="Backspace"){e.preventDefault();compactPressAmount("back");}
  else if(e.key==="Enter"){e.preventDefault();saveTx();}
});

function reminderTick(){
  if(!S||!S.settings.notify)return;
  const now=new Date();const hm=now.toTimeString().slice(0,5);
  if(hm>=S.settings.reminderTime && S.meta.lastNotifiedDate!==TODAY() && S.meta.lastEntryDate!==TODAY()){
    S.meta.lastNotifiedDate=TODAY();persist();
    if("Notification"in window&&Notification.permission==="granted"){
      new Notification("Пора внести финансы",{body:"За сегодня ещё нет записей. Заполните доходы и расходы."});
    }else{toast("Напоминание: внесите операции за сегодня");}
  }
}
setInterval(reminderTick,60000);

function normalizeName(v){return String(v||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/g,' ').trim();}
function ensureBusinessModel(){
  let changed=false;
  S.legalEntities=Array.isArray(S.legalEntities)?S.legalEntities:[];
  const ensureEntity=(id,name,type,system=false)=>{let x=S.legalEntities.find(e=>e.id===id)||S.legalEntities.find(e=>normalizeName(e.name)===normalizeName(name));if(!x){x={id,name,type,archived:false,system};S.legalEntities.push(x);changed=true;}else{if(!x.type){x.type=type;changed=true;}if(system&&!x.system){x.system=true;changed=true;}}return x;};
  const ip=ensureEntity('le-ip','ИП','ip'),ooo=ensureEntity('le-ooo','ООО','ooo'),cashEntity=ensureEntity('le-cash','Наличные','cash',true);
  S.businesses=Array.isArray(S.businesses)?S.businesses:[];
  const bizDefs=[
    ['biz-coffee','Кофейня','☕',ip.id,false,false,/коф/],['biz-vending','Вендинг','🥤',ip.id,false,false,/вендинг/],['biz-tolbukhina','Студия Толбухина, 2','🧘',ip.id,false,true,/толбух/],['biz-kuibysheva','Студия Куйбышева, 22','🧘',ooo.id,false,true,/куйбыш/],['biz-masherova','Студия Машерова, 11','🧘',ooo.id,false,true,/машеров/],['biz-ooo-common','Общие расходы ООО','🏢',ooo.id,true,false,/общ.*ооо/]
  ];
  const bizMap={};
  for(const [id,name,emoji,legalEntityId,technical,acceptsCash,rx] of bizDefs){
    let b=S.businesses.find(x=>x.id===id)||S.businesses.find(x=>rx.test(normalizeName(x.name)));
    if(!b){b={id,name,emoji,legalEntityId,cashOpening:0,acceptsCash,archived:false,technical};S.businesses.push(b);changed=true;}
    else{
      if(!b.legalEntityId){b.legalEntityId=legalEntityId;changed=true;}
      if(typeof b.archived!=='boolean'){b.archived=false;changed=true;}
      if(technical&&!b.technical){b.technical=true;changed=true;}
      if(typeof b.acceptsCash!=='boolean'){b.acceptsCash=acceptsCash;changed=true;}
      if(typeof b.cashOpening!=='number'){
        b.cashOpening=acceptsCash?(Number(b.opening)||0):0;changed=true;
      }
      if(Number(b.opening)||0){b.opening=0;changed=true;}
    }
    bizMap[id]=b.id;
  }
  for(const b of S.businesses){
    if(!b.legalEntityId||b.legalEntityId===cashEntity.id){b.legalEntityId=ip.id;b.needsOwnershipReview=true;changed=true;}
    if(typeof b.archived!=='boolean'){b.archived=false;changed=true;}
    if(typeof b.acceptsCash!=='boolean'){b.acceptsCash=/студ/.test(normalizeName(b.name));changed=true;}
    if(typeof b.cashOpening!=='number'){b.cashOpening=b.acceptsCash?(Number(b.opening)||0):0;changed=true;}
    if(Number(b.opening)||0){b.opening=0;changed=true;}
  }
  S.accounts=Array.isArray(S.accounts)?S.accounts:[];
  for(const a of S.accounts){if(!a.scope){a.scope='personal';a.legalEntityId=null;a.businessIds=[];changed=true;}if(!Array.isArray(a.businessIds)){a.businessIds=[];changed=true;}if(typeof a.archived!=='boolean'){a.archived=false;changed=true;}if(typeof a.bankName!=='string'){a.bankName='';changed=true;}}
  if(!(S.accounts||[]).some(a=>a.scope!=="business")){
    S.accounts.push(
      {id:"acc-personal-card",name:"Личная карта",bankName:"",emoji:"💳",kind:"card",currency:baseCode(),opening:0,limit:0,archived:false,scope:"personal",legalEntityId:null,businessIds:[]},
      {id:"acc-personal-cash",name:"Личные наличные",bankName:"",emoji:"💵",kind:"cash",currency:baseCode(),opening:0,limit:0,archived:false,scope:"personal",legalEntityId:null,businessIds:[]}
    );
    changed=true;
  }
  const accDefs=[
    ['acc-ip-paritet','ИП · Паритет Банк','Паритет Банк',ip.id,[bizMap['biz-coffee']],/паритет/],
    ['acc-ip-belarusbank','ИП · Беларусбанк','Беларусбанк',ip.id,[bizMap['biz-vending']],/беларус/],
    ['acc-ip-alfa','ИП · Альфа-Банк','Альфа-Банк',ip.id,[bizMap['biz-tolbukhina']],/альфа/],
    ['acc-ooo-alfa','ООО · Альфа-Банк','Альфа-Банк',ooo.id,[bizMap['biz-kuibysheva'],bizMap['biz-masherova'],bizMap['biz-ooo-common']],/альфа/]
  ];
  const claimed=new Set();
  for(const [id,name,bankName,legalEntityId,businessIds,bankRx] of accDefs){
    let a=S.accounts.find(x=>x.id===id);
    if(!a){
      const candidates=S.accounts.filter(x=>!claimed.has(x.id)&&!hasAccountTx(x.id)&&!isCashPoolAccount(x)&&bankRx.test(normalizeName((x.bankName||'')+' '+(x.name||''))));
      if(bankRx.source==='альфа'){
        const ownerCue=legalEntityId===ooo.id?/ооо/:/ип/;
        a=candidates.find(x=>ownerCue.test(normalizeName(x.name)));
        if(!a&&candidates.length&&(candidates.length>=2||[...claimed].some(v=>v==='acc-ip-alfa'||v==='acc-ooo-alfa')))a=candidates[0];
      }else a=candidates[0];
      if(a){a.id=id;changed=true;}
    }
    if(!a){a={id,name,bankName,emoji:'🏦',kind:'card',currency:'BYN',opening:0,limit:0,archived:false,scope:'business',legalEntityId,businessIds};S.accounts.push(a);changed=true;}
    else{
      claimed.add(a.id);a.scope='business';a.legalEntityId=legalEntityId;a.businessIds=[...new Set([...(a.businessIds||[]),...businessIds])];
      if(!a.bankName)a.bankName=bankName;if(!a.name||/^(альфа|паритет|беларус)/i.test(a.name))a.name=name;
    }
  }
  const studioIds=[bizMap['biz-tolbukhina'],bizMap['biz-kuibysheva'],bizMap['biz-masherova']].filter(Boolean);
  let cash=S.accounts.find(a=>a.id==='acc-studios-cash')||S.accounts.find(a=>a.sharedCash)||S.accounts.find(a=>/налич.*студи|общ.*касс/.test(normalizeName((a.name||'')+' '+(a.bankName||''))));
  if(!cash){cash={id:'acc-studios-cash',name:'Наличные · 3 студии',bankName:'Общая касса',emoji:'💵',kind:'cash',currency:'BYN',opening:0,limit:0,archived:false,scope:'business',legalEntityId:cashEntity.id,businessIds:studioIds,sharedCash:true,system:true};S.accounts.push(cash);changed=true;}
  else{
    if(cash.id!=='acc-studios-cash'){cash.id='acc-studios-cash';changed=true;}
    Object.assign(cash,{scope:'business',legalEntityId:cashEntity.id,kind:'cash',currency:'BYN',limit:0,archived:false,sharedCash:true,system:true});
    cash.name=cash.name||'Наличные · 3 студии';cash.bankName=cash.bankName||'Общая касса';cash.emoji=cash.emoji||'💵';cash.opening=0;
    cash.businessIds=[...new Set([...(cash.businessIds||[]),...studioIds])].filter(id=>bizById(id)?.acceptsCash);
  }
  for(const t of S.tx||[]){
    if(!t.biz||!['biz_income','biz_expense','draw','contribution','biz_adjustment'].includes(t.type))continue;
    const b=bizById(t.biz);if(!b)continue;
    const linked=t.type==='draw'||t.type==='contribution'?accById(t.businessAccount):accById(t.account);
    if(!t.paymentMethod){t.paymentMethod=isCashPoolAccount(linked)||(!linked&&b.acceptsCash)?'cash':'bank';changed=true;}
    if(t.paymentMethod==='cash'&&b.acceptsCash){
      if(t.type==='draw'||t.type==='contribution'){if(t.businessAccount!==cash.id){t.businessAccount=cash.id;changed=true;}}
      else if(t.account!==cash.id){t.account=cash.id;changed=true;}
    }
    if(t.type==='biz_adjustment'&&t.paymentMethod==='cash'&&t.account!==cash.id){t.account=cash.id;changed=true;}
  }
  S.debts=Array.isArray(S.debts)?S.debts:[];
  for(const d of S.debts){if(!d.currency){d.currency=baseCode();changed=true;}if(!Array.isArray(d.repaid)){d.repaid=[];changed=true;}}
  S.meta=S.meta||{};if((S.meta.modelVersion||0)<6){S.meta.modelVersion=6;changed=true;}
  return changed;
}

let authSubscribed=false; let initRun=0;
function renderLogin(){
  S=null;applyTheme();closeModal();
  const app=document.getElementById("app");
  app.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:20px">'+
    '<div class="card pad" style="width:100%;max-width:420px">'+
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:18px"><div class="brand" style="padding:0"><div class="mark">Br</div><div><b>Финансы</b><small>личный контроль</small></div></div></div>'+
      '<h1 style="font-size:23px;margin-bottom:5px">Вход</h1>'+
      '<p class="muted" style="margin:0 0 18px">Введите имя пользователя и пароль.</p>'+
      '<div class="field"><label>Имя пользователя</label><input class="inp" id="login-username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="admin"></div>'+
      '<div class="field"><label>Пароль</label><input class="inp" id="login-password" type="password" autocomplete="current-password" placeholder="Пароль"></div>'+
      '<button class="btn primary" id="login-submit" style="width:100%;justify-content:center">Войти</button>'+
      '<div class="fs13 muted" id="login-status" style="margin-top:12px;min-height:20px"></div>'+
    '</div></div>';
  const username=document.getElementById("login-username");
  const password=document.getElementById("login-password");
  const btn=document.getElementById("login-submit");
  const status=document.getElementById("login-status");
  const submit=async()=>{
    const name=username.value.trim().toLowerCase();
    const pass=password.value;
    if(!/^[a-z0-9._-]{3,32}$/.test(name)){
      status.textContent="Имя: 3–32 символа, латинские буквы, цифры, точка, дефис или подчёркивание";
      username.focus();return;
    }
    if(!pass){status.textContent="Введите пароль";password.focus();return;}
    btn.disabled=true;btn.textContent="Входим…";status.textContent="";
    try{
      const {error}=await window.PFBackend.signInWithUsernamePassword(name,pass);
      if(error)throw error;
      status.textContent="Вход выполнен";
    }catch(e){
      status.textContent="Неверное имя пользователя или пароль";
      btn.disabled=false;btn.textContent="Войти";
      password.select();
    }
  };
  btn.addEventListener("click",submit);
  username.addEventListener("keydown",e=>{if(e.key==="Enter")password.focus();});
  password.addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
  username.focus();
}
async function init(){
  const run=++initRun;setupThemeListener();applyTheme();
  if(window.PFBackendReady)await window.PFBackendReady;
  if(window.PFBackend){
    if(!authSubscribed){
      authSubscribed=true;
      window.PFBackend.onChange(user=>{if(user)init();else renderLogin();});
    }
    if(!window.PFBackend.user){renderLogin();return;}
  }
  const saved=await Store.load();
  if(run!==initRun)return;
  S=saved||seed();
  baseRev=stateRev(saved); syncDirty=false; setSyncStatus(window.PFBackend?'synced':'local');
  if(ensureBusinessModel())persist();
  if(ensureUxState())persist();applyTheme();
  // Однократный переход с прежней RUB-демо-базы: полностью очищаем данные и начинаем в BYN.
  if(saved&&((S.settings&&S.settings.baseCurrency)!=="BYN"||!(S.currencies||[]).some(c=>c.code==="BYN"))){
    S=seed();
    persist();
  }
  // миграция: старый единый список categories.biz -> bizIn / bizOut
  if(S.categories && (!S.categories.bizIn || !S.categories.bizOut)){
    const old=S.categories.biz||[];
    S.categories.bizIn=old.filter(c=>/выруч|доход/i.test(c));
    if(!S.categories.bizIn.length)S.categories.bizIn=["Выручка","Прочий доход бизнеса"];
    S.categories.bizOut=old.filter(c=>!/выруч|доход/i.test(c));
    if(!S.categories.bizOut.length)S.categories.bizOut=["ЗП тренерам","ЗП администраторам","Аренда помещения","Закупка товара","Обслуживание аппарата","Реклама","Ремонт / инвентарь","Прочее"];
    delete S.categories.biz;
    persist();
  }
  // миграция: старая модель без валют/счетов -> добавляем базовую валюту и единый счёт
  if(!S.currencies){
    const symb=(S.settings&&S.settings.currency)||"₽";
    S.currencies=[{code:"RUB",symbol:symb,rate:1}];
    if(!S.settings)S.settings={};
    S.settings.baseCurrency="RUB";
    persist();
  }
  if(!S.accounts){
    S.accounts=[{id:"a0",name:"Основной счёт",bankName:"",kind:"card",currency:baseCode(),opening:(S.settings&&+S.settings.openingPersonal)||0,limit:0,emoji:"💳",scope:"personal",legalEntityId:null,businessIds:[],archived:false}];
    // привязываем существующие личные операции к основному счёту
    (S.tx||[]).forEach(t=>{ if(!t.account && (t.type==="in"||t.type==="out"||t.type==="draw"||t.type==="contribution"))t.account="a0"; });
    persist();
  }
  let accountMetaChanged=false;
  (S.accounts||[]).forEach(a=>{if(typeof a.archived!=="boolean"){a.archived=false;accountMetaChanged=true;}});
  if(accountMetaChanged)persist();
  if(ensureUxState())persist();applyTheme();
  if(!saved)persist();
  render();
  if(S.ui.view==="add")setTimeout(refreshAddForm,0);
  updateRatesFromNBRB().then(ok=>{if(ok&&S){render();if(S.ui.view==="add")setTimeout(refreshAddForm,0);}});
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reconcileFromRemote();});
init();
</script>
