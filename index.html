<!-- Личный финансовый дашборд — интерактивный прототип -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161A21">
<title>Финансы — личный дашборд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#EAEEF2; --surface:#FFFFFF; --surface-2:#F6F8FA; --surface-3:#EFF3F6;
  --ink:#161A21; --ink-2:#3B4250; --muted:#697386; --faint:#9AA4B2;
  --line:#E1E7ED; --line-strong:#D2DAE2;
  --personal:#0E7C6B; --personal-bg:#E6F4F0; --personal-line:#BFE4DB;
  --biz:#B26A08; --biz-bg:#FBF1E1; --biz-line:#EDD6AF;
  --asset:#2456C7; --asset-bg:#E7EEFB;
  --liab:#C1334C; --liab-bg:#FBE9EC;
  --goal:#6B3FA0; --goal-bg:#F0E9F8;
  --ok:#0E7C6B; --warn:#B26A08; --bad:#C1334C;
  --radius:15px; --radius-s:10px;
  --shadow:0 1px 2px rgba(20,30,45,.04),0 8px 24px -12px rgba(20,30,45,.14);
  --shadow-s:0 1px 2px rgba(20,30,45,.06);
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --disp:'Space Grotesk',system-ui,sans-serif;
  --body:'Inter',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--body); background:var(--bg); color:var(--ink);
  -webkit-font-smoothing:antialiased; font-size:14.5px; line-height:1.45;
}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14.5px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
h1,h2,h3,h4{font-family:var(--disp);margin:0;font-weight:600;letter-spacing:-.01em}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.nav{
  background:var(--surface);border-right:1px solid var(--line);
  padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;
  display:flex;flex-direction:column;gap:4px
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px}
.brand .mark{
  width:30px;height:30px;border-radius:9px;background:var(--ink);
  display:grid;place-items:center;color:#fff;font-family:var(--disp);font-weight:700;font-size:15px;
  flex:0 0 auto
}
.brand b{font-family:var(--disp);font-weight:600;font-size:15.5px;letter-spacing:-.01em}
.brand small{display:block;color:var(--faint);font-size:11px;font-weight:500;margin-top:1px}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:var(--radius-s);
  color:var(--ink-2);font-weight:500;border:none;background:none;width:100%;text-align:left;
  font-size:14px;transition:background .12s,color .12s
}
.nav-item svg{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;opacity:.85}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.on{background:var(--ink);color:#fff}
.nav-item.on svg{opacity:1}
.nav-sep{height:1px;background:var(--line);margin:8px 6px}
.nav-foot{margin-top:auto;padding:8px;color:var(--faint);font-size:11px;line-height:1.5}

.main{padding:26px 30px 60px;max-width:1180px;width:100%}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head .t h1{font-size:23px}
.page-head .t p{margin:3px 0 0;color:var(--muted);font-size:13.5px}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:10px;font-weight:500;
  font-size:13.5px;transition:.12s;white-space:nowrap
}
.btn svg{width:16px;height:16px;stroke:currentColor}
.btn:hover{background:var(--surface-2);border-color:var(--line-strong)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#242a34}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-3)}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
.btn.danger{color:var(--bad);border-color:var(--liab-bg)}
.btn.danger:hover{background:var(--liab-bg)}

/* ---------- Cards / grid ---------- */
.grid{display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-s)}
.card.pad{padding:18px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:15px}
.card-b{padding:16px 18px}
.eyebrow{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}

/* reminder banner */
.reminder{
  display:flex;align-items:center;gap:14px;background:var(--ink);color:#fff;
  border-radius:var(--radius);padding:14px 18px;margin-bottom:18px
}
.reminder .dot{width:9px;height:9px;border-radius:50%;background:#F5C451;flex:0 0 auto;box-shadow:0 0 0 4px rgba(245,196,81,.22)}
.reminder .txt{flex:1}
.reminder .txt b{font-family:var(--disp);font-size:14.5px}
.reminder .txt span{display:block;color:#B9C1CD;font-size:12.5px;margin-top:1px}
.reminder .btn{background:#fff;color:var(--ink);border-color:#fff}
.reminder .x{background:none;border:none;color:#8b94a3;font-size:18px;line-height:1;padding:4px}

/* ---------- Split balance (signature) ---------- */
.split{display:grid;grid-template-columns:1.15fr 1fr;gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.split .side{padding:22px 24px;position:relative}
.split .side.personal{background:linear-gradient(180deg,var(--personal-bg),#fff 78%)}
.split .side.biz{background:linear-gradient(180deg,var(--biz-bg),#fff 78%);border-left:1px solid var(--line)}
.side .lbl{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;font-family:var(--disp)}
.side .lbl .tag{width:8px;height:8px;border-radius:2px}
.personal .tag{background:var(--personal)}.biz .tag{background:var(--biz)}
.side .hint{color:var(--muted);font-size:11.5px;margin:2px 0 14px;max-width:32ch}
.side .amt{font-family:var(--mono);font-weight:700;font-size:32px;letter-spacing:-.03em;line-height:1}
.personal .amt{color:var(--personal)}.biz .amt{color:var(--biz)}
.side .sub{margin-top:12px;display:flex;gap:18px;flex-wrap:wrap}
.side .sub .k{font-size:11px;color:var(--muted);font-family:var(--mono);letter-spacing:.03em}
.side .sub .v{font-family:var(--mono);font-weight:600;font-size:14px;display:block;margin-top:1px}

/* ---------- Stat cards ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--shadow-s)}
.stat .top{display:flex;align-items:center;justify-content:space-between}
.stat .name{font-size:12px;color:var(--muted);font-weight:500}
.stat .ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center}
.stat .ico svg{width:15px;height:15px}
.stat .val{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:-.02em;margin-top:9px}
.stat .foot{font-size:11.5px;color:var(--muted);margin-top:3px}
.i-in{background:var(--personal-bg);color:var(--personal)}
.i-out{background:var(--liab-bg);color:var(--liab)}
.i-asset{background:var(--asset-bg);color:var(--asset)}
.i-liab{background:var(--liab-bg);color:var(--liab)}
.i-biz{background:var(--biz-bg);color:var(--biz)}
.i-goal{background:var(--goal-bg);color:var(--goal)}

.pos{color:var(--personal)}.neg{color:var(--liab)}.amber{color:var(--biz)}.blue{color:var(--asset)}.purple{color:var(--goal)}

/* ---------- Table ---------- */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;font-weight:600;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-family:var(--mono);padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:11px 12px;border-bottom:1px solid var(--surface-3);font-size:13.5px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:500;font-family:var(--mono)}
.chip .d{width:6px;height:6px;border-radius:50%}
.chip.c-in{background:var(--personal-bg);color:var(--personal)}
.chip.c-out{background:var(--liab-bg);color:var(--liab)}
.chip.c-draw{background:var(--biz-bg);color:var(--biz)}
.chip.c-contribution{background:#EEF1F4;color:var(--ink-2)}
.chip.c-biz_income{background:var(--personal-bg);color:var(--personal)}
.chip.c-biz_expense{background:var(--liab-bg);color:var(--liab)}
.chip.c-adjustment{background:var(--surface-3);color:var(--ink-2)}
.chip.c-transfer{background:var(--asset-bg);color:var(--asset)}
.tag-cat{background:var(--surface-3);color:var(--ink-2);padding:2px 8px;border-radius:6px;font-size:12px}

/* ---------- Forms ---------- */
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:500;color:var(--ink-2);margin-bottom:5px}
.field .hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.inp,select.inp,textarea.inp{
  width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--radius-s);
  background:var(--surface);color:var(--ink);transition:.12s;outline:none
}
.inp:focus{border-color:var(--personal);box-shadow:0 0 0 3px var(--personal-bg)}
textarea.inp{resize:vertical;min-height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

/* type picker */
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
.type-btn{
  border:1px solid var(--line-strong);background:var(--surface);border-radius:11px;padding:11px 10px;
  text-align:left;transition:.12s;display:flex;flex-direction:column;gap:2px
}
.type-btn:hover{border-color:var(--line-strong);background:var(--surface-2)}
.type-btn.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.type-btn .tt{font-weight:600;font-size:13px;font-family:var(--disp)}
.type-btn .td{font-size:10.5px;color:var(--muted);line-height:1.3}
.type-btn .bar{height:3px;border-radius:2px;margin-bottom:6px;width:26px}

/* segmented */
.seg{display:inline-flex;background:var(--surface-3);border-radius:9px;padding:3px;gap:2px}
.seg button{border:none;background:none;padding:6px 12px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s)}

/* progress */
.prog{height:9px;border-radius:20px;background:var(--surface-3);overflow:hidden}
.prog>span{display:block;height:100%;border-radius:20px}

/* empty */
.empty{text-align:center;padding:34px 18px;color:var(--muted)}
.empty svg{width:34px;height:34px;stroke:var(--faint);margin-bottom:10px}
.empty b{display:block;font-family:var(--disp);color:var(--ink);font-size:15px;margin-bottom:3px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(22,26,33,.42);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:50;padding:20px;animation:fade .15s}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:520px;max-height:90vh;overflow:auto;box-shadow:0 24px 60px -18px rgba(20,30,45,.4)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.modal-h h3{font-size:16px}
.modal-b{padding:20px}
.modal-f{display:flex;gap:10px;justify-content:flex-end;padding:0 20px 20px}
.x-btn{background:none;border:none;font-size:20px;color:var(--muted);line-height:1;padding:4px 6px;border-radius:6px}
.x-btn:hover{background:var(--surface-2)}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* toast */
.toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:var(--ink);color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;box-shadow:var(--shadow);animation:pop .2s;display:flex;align-items:center;gap:9px}
.toast .d{width:7px;height:7px;border-radius:50%;background:var(--personal)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* misc */
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--surface-3)}
.list-row:last-child{border-bottom:none}
.avatar{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--disp);font-weight:600;font-size:13px;flex:0 0 auto}
.muted{color:var(--muted)}.fs12{font-size:12px}.fs13{font-size:13px}
.spacer{flex:1}
.due-soon{color:var(--biz);font-weight:600}
.due-over{color:var(--liab);font-weight:600}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.mobile-nav{display:none}
.mobile-top{display:none}
.bottom-nav{display:none}
.sheet-item{display:flex;align-items:center;gap:13px;padding:14px 8px;border:none;background:none;width:100%;text-align:left;font-size:15.5px;color:var(--ink);border-bottom:1px solid var(--surface-3)}
.sheet-item:last-child{border-bottom:none}
.sheet-item svg{width:20px;height:20px;stroke:var(--ink-2)}
.sheet-item.on{color:var(--personal)}
.sheet-item.on svg{stroke:var(--personal)}
.hidden{display:none!important}
.divider{height:1px;background:var(--line);margin:16px 0}
.kpi-line{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px dashed var(--surface-3)}
.kpi-line:last-child{border-bottom:none}
.kpi-line b{font-family:var(--mono)}

/* ---- Планшет ---- */
@media (max-width:900px){
  .main{padding:22px 20px 40px}
  .split{grid-template-columns:1fr}
  .split .side.biz{border-left:none;border-top:1px solid var(--line)}
  .stats{grid-template-columns:1fr 1fr}
  .two,.row2,.row3{grid-template-columns:1fr}
  .main .grid{grid-template-columns:1fr!important}
  .types{grid-template-columns:1fr 1fr}
  .page-head{align-items:flex-start}
}

/* ---- Телефон ---- */
@media (max-width:640px){
  body{font-size:15px}
  .app{grid-template-columns:1fr}
  .nav{display:none}
  .main{padding:14px 13px 96px}            /* место под нижнюю навигацию */

  /* верхняя шапка */
  .mobile-top{
    display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;
    background:var(--surface);border-bottom:1px solid var(--line);
    padding:11px 15px;padding-top:calc(11px + env(safe-area-inset-top))
  }
  .mobile-top .mark{width:28px;height:28px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:14px}
  .mobile-top .ttl{font-family:var(--disp);font-weight:600;font-size:16px}
  .mobile-top .spacer{flex:1}
  .mobile-top .top-add{background:var(--personal);color:#fff;border:none;border-radius:9px;padding:8px 13px;font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:5px}
  .mobile-top .top-add svg{width:15px;height:15px;stroke:#fff}

  /* нижняя навигация */
  .bottom-nav{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;
    background:var(--surface);border-top:1px solid var(--line);
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    justify-content:space-around;align-items:flex-end;
    box-shadow:0 -4px 20px -12px rgba(20,30,45,.25)
  }
  .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;padding:6px 2px;color:var(--faint);font-size:10.5px;font-weight:500}
  .bn-item svg{width:22px;height:22px;stroke:currentColor}
  .bn-item.on{color:var(--ink)}
  .bn-center{flex:0 0 auto;transform:translateY(-10px)}
  .bn-center .fab{width:54px;height:54px;border-radius:17px;background:var(--personal);color:#fff;display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(14,124,107,.55);margin-bottom:2px}
  .bn-center .fab svg{width:26px;height:26px;stroke:#fff;stroke-width:2}
  .bn-center span{color:var(--personal);font-weight:600}

  /* заголовки страниц компактнее */
  .page-head{margin-bottom:16px}
  .page-head .t h1{font-size:20px}
  .page-head .t p{font-size:12.5px}

  /* сплит-баланс компактнее */
  .split .side{padding:18px}
  .side .amt{font-size:28px}
  .stats{grid-template-columns:1fr 1fr;gap:10px}
  .stat{padding:13px}
  .stat .val{font-size:19px}
  .types{grid-template-columns:1fr}
  .type-btn{flex-direction:row;align-items:center;gap:10px}
  .type-btn .bar{margin-bottom:0;width:4px;height:30px}

  /* крупные поля — чтобы iOS не зумил (>=16px) */
  .inp,select.inp,textarea.inp{font-size:16px;padding:12px 13px}
  .btn{padding:11px 15px;font-size:14px}
  .btn.sm{padding:8px 12px;font-size:13px}

  /* таблицы -> карточки */
  table thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tbody tr{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:var(--surface);padding:4px 2px}
  tbody tr:hover{background:var(--surface)}
  td{border:none!important;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 13px;text-align:right}
  td::before{content:attr(data-label);color:var(--muted);font-size:12px;font-weight:500;text-align:left;flex:0 0 auto}
  td.no-label{justify-content:flex-end}
  td.no-label::before{content:""}
  td .num,td.num{text-align:right}

  /* модалки -> нижняя шторка */
  .modal-bg{align-items:flex-end;padding:0}
  .modal{max-width:100%;width:100%;border-radius:20px 20px 0 0;max-height:92vh;animation:sheetUp .22s ease}
  .modal-h{padding:16px 18px}
  .modal-b{padding:18px}
  .modal-f{padding:0 18px 18px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .modal-f .btn{flex:1;justify-content:center}

  /* полосы со счетами — приятная прокрутка */
  .card-b[style*="overflow-x"]{scroll-snap-type:x mandatory}
  .card-b[style*="overflow-x"]>div{scroll-snap-align:start}

  .toast-wrap{bottom:calc(96px + env(safe-area-inset-bottom))}
  .reminder{flex-wrap:wrap}
  .reminder .txt{flex:1 1 100%}
  .filters{gap:7px}
}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app"></div>
<div id="modal-root"></div>
<div class="toast-wrap" id="toast-root"></div>

      const value=String(username||'').trim().toLowerCase();
      if(!/^[a-z0-9._-]{3,32}$/.test(value))throw new Error('invalid username');
      return value+'@'+USERNAME_DOMAIN;

      user: null,

      async signInWithUsernamePassword(username,password){
        let email;

        catch(e){ return { error:e }; }
        const { error } = await sb.auth.signInWithPassword({ email, password });
        return { error };
      },
      async signOut(){ return await sb.auth.signOut(); },
      async load(){
        const { data:{ user } } = await sb.auth.getUser();
        if(!user) return null;
        const { data, error } = await sb.from('app_state').select('data').eq('user_id', user.id).maybeSingle();
        if(error) throw error;
        return data ? data.data : null;
      },
      async save(state){
        const { data:{ user } } = await sb.auth.getUser();
        if(!user) throw new Error('not authenticated');
        const { error } = await sb.from('app_state')
          .upsert({ user_id:user.id, data:state }, { onConflict:'user_id' });
        if(error) throw error;
      }
    };

    const notify=user=>{
      window.PFBackend.user=user||null;
      window.PFBackend._cbs.forEach(cb=>{ try{ cb(window.PFBackend.user); }catch(_){} });
    };
    sb.auth.onAuthStateChange((_e,session)=>notify(session?.user||null));
    const { data:{ user } } = await sb.auth.getUser();
    notify(user||null);
    window.__resolvePFBackendReady(window.PFBackend);
  }catch(e){
    console.error('Supabase недоступен:',e);
    window.__resolvePFBackendReady(null);
  }
})();

/* =========================================================
   КУРСЫ НАЦИОНАЛЬНОГО БАНКА РБ
   ========================================================= */
async function updateRatesFromNBRB(){
  try{
    const r=await fetch("https://api.nbrb.by/exrates/rates?periodicity=0",{cache:"no-store"});
    if(!r.ok)throw new Error("NBRB HTTP "+r.status);
    const rows=await r.json();
    const bynPerUnit={BYN:1};
    for(const row of rows){
      const code=String(row.Cur_Abbreviation||"").toUpperCase();
      const scale=Number(row.Cur_Scale)||1;
      const official=Number(row.Cur_OfficialRate);
      if(code&&Number.isFinite(official)&&official>0)bynPerUnit[code]=official/scale;
    }
    const base=baseCode();
    const baseRate=bynPerUnit[base];
    if(!baseRate)throw new Error("Базовая валюта отсутствует в курсах НБРБ");
    let changed=false;
    for(const c of S.currencies||[]){
      const n=bynPerUnit[c.code];
      if(!n)continue;
      const next=c.code===base?1:n/baseRate;
      if(Math.abs((Number(c.rate)||0)-next)>1e-12){c.rate=next;changed=true;}
    }
    const bc=curObj(base);if(bc)bc.rate=1;
    if(changed)persist();
    return true;
  }catch(e){
    console.warn("Не удалось обновить курсы НБРБ:",e);
    return false;
  }
}

let S=null; let saveTimer=null;
function persist(){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>Store.save(S),120); }

/* =========================================================
   ВЫЧИСЛЕНИЯ
   ========================================================= */
/* --- Валюты --- */
function baseCode(){return (S.settings&&S.settings.baseCurrency)||"BYN";}
function curObj(code){return (S.currencies||[]).find(c=>c.code===code);}
function sym(code){const c=curObj(code);return c?c.symbol:(code||"");}
function rate(code){const c=curObj(code);return c?(+c.rate||1):1;}
function toBase(amt,code){return (Number(amt)||0)*rate(code||baseCode());}
const C=()=> sym(baseCode());
function fmt(n,sign,code){
  code=code||baseCode();
  const v=Math.round((Number(n)||0)*100)/100;
  const s=new Intl.NumberFormat("ru-RU",{minimumFractionDigits:2,maximumFractionDigits:2}).format(Math.abs(v));
  const pre=(sign&&v>0)?"+":(v<0?"−":"");
  return pre+s+" "+sym(code);
}
/* --- Счета --- */
function accById(id){return (S.accounts||[]).find(a=>a.id===id);}
function entityById(id){return (S.legalEntities||[]).find(x=>x.id===id);}
function bizById(id){return (S.businesses||[]).find(b=>b.id===id);}
function entityTypeLabel(type){return type==="ooo"?"ООО":"ИП";}
function ownerLabel(a){if(!a)return "—";if(a.scope!=="business")return "Личный";const e=entityById(a.legalEntityId);return e?e.name:"Юрлицо не указано";}
function isPersonalAccount(a){return !!a&&a.scope!=="business";}
function isBusinessAccount(a){return !!a&&a.scope==="business";}
function personalAccounts(){return activeAccounts().filter(isPersonalAccount);}
function businessAccounts(){return activeAccounts().filter(isBusinessAccount);}
function businessAccountsForBiz(id){
  const b=bizById(id);if(!b)return [];
  return activeAccounts().filter(a=>isBusinessAccount(a)&&a.legalEntityId===b.legalEntityId&&((a.businessIds||[]).includes(id)));
}
function accCur(t){const a=t&&t.account?accById(t.account):null;return a?a.currency:baseCode();}
function hasAccountTx(id){return (S.tx||[]).some(t=>t.account===id||t.businessAccount===id||t.fromAccount===id||t.toAccount===id);}
function hasBizTx(id){return (S.tx||[]).some(t=>t.biz===id);}
function hasEntityLinks(id){return (S.businesses||[]).some(b=>b.legalEntityId===id)||(S.accounts||[]).some(a=>a.legalEntityId===id);}
function activeAccounts(){return (S.accounts||[]).filter(a=>!a.archived);}
function activeBusinesses(){return (S.businesses||[]).filter(b=>!b.archived);}
function accountBalance(id){
  const a=accById(id); if(!a)return 0;
  let v=Number(a.opening)||0;
  for(const t of S.tx||[]){
    if(t.type==="transfer"||t.type==="entity_transfer"){
      if(t.fromAccount===id)v-=Number(t.amount)||0;
      if(t.toAccount===id)v+=Number(t.toAmount)||0;
      continue;
    }
    if((t.type==="draw"||t.type==="contribution")&&t.businessAccount===id){
      const ba=Number(t.businessAmount)||0;
      if(t.type==="draw")v-=ba;
      else v+=ba;
      continue;
    }
    if(t.account!==id)continue;
    if(t.type==="in"||t.type==="draw"||t.type==="biz_income")v+=Number(t.amount)||0;
    else if(t.type==="out"||t.type==="contribution"||t.type==="biz_expense")v-=Number(t.amount)||0;
    else if(t.type==="account_adjustment")v+=Number(t.delta)||0;
  }
  return v;
}
function accUsedCredit(id){const b=accountBalance(id);return b<0?-b:0;}
function accAvailable(id){const a=accById(id);return accountBalance(id)+(Number(a.limit)||0);}
function accKindLabel(k){return k==="credit"?"кредитка / овердрафт":k==="cash"?"наличные":"расчётный счёт / карта";}

function monthKey(d){return (d||"").slice(0,7);}
function inThisMonth(d){return monthKey(d)===monthKey(TODAY());}

/* Личный итог — только личные счета. Счета ИП и ООО считаются отдельно как деньги бизнеса. */
function personalBalance(){
  return (S.accounts||[]).filter(isPersonalAccount).reduce((s,a)=>s+toBase(accountBalance(a.id),a.currency),0);
}
function businessBankBalance(){
  return (S.accounts||[]).filter(isBusinessAccount).reduce((s,a)=>s+toBase(accountBalance(a.id),a.currency),0);
}
function totalCreditUsed(){return (S.accounts||[]).filter(isPersonalAccount).reduce((s,a)=>s+toBase(accUsedCredit(a.id),a.currency),0);}
function totalAvailable(){return personalAccounts().reduce((s,a)=>s+toBase(accAvailable(a.id),a.currency),0);}

function bizBalance(id){
  const b=bizById(id); let v=b?Number(b.opening)||0:0;
  for(const t of S.tx||[]){ if(t.biz!==id)continue;
    const acc=t.account?accById(t.account):null;
    const bacc=t.businessAccount?accById(t.businessAccount):null;
    if(t.type==="biz_income")v+=toBase(t.amount,acc?acc.currency:baseCode());
    else if(t.type==="biz_expense")v-=toBase(t.amount,acc?acc.currency:baseCode());
    else if(t.type==="draw")v-=toBase(t.businessAmount||t.amount,bacc?bacc.currency:(acc?acc.currency:baseCode()));
    else if(t.type==="contribution")v+=toBase(t.businessAmount||t.amount,bacc?bacc.currency:(acc?acc.currency:baseCode()));
    else if(t.type==="biz_adjustment")v+=Number(t.delta)||0;
  }
  return v;
}
function bizTotalBalance(){return businessBankBalance();}

/* Все агрегаты — в базовой валюте (каждая операция конвертируется по валюте счёта) */
function sumTx(pred){return S.tx.filter(pred).reduce((s,t)=>s+toBase(t.amount, t.account?accCur(t):baseCode()),0);}
function monthAgg(){
  return {
    income: sumTx(t=>t.type==="in"&&inThisMonth(t.date)),
    expense: sumTx(t=>t.type==="out"&&inThisMonth(t.date)),
    draw: sumTx(t=>t.type==="draw"&&inThisMonth(t.date)),
    contribution: sumTx(t=>t.type==="contribution"&&inThisMonth(t.date)),
  };
}
function netDrawMonth(){const a=monthAgg();return a.draw-a.contribution;}
function realIncomeMonth(){const a=monthAgg();return a.income+(a.draw-a.contribution);} // личный + чистый вывод

function debtRemaining(d){return d.amount-(d.repaid||[]).reduce((s,r)=>s+r.amount,0);}
function owedToMe(){return S.debts.filter(d=>d.dir==="in").reduce((s,d)=>s+Math.max(0,debtRemaining(d)),0);}
function iOwe(){return S.debts.filter(d=>d.dir==="out").reduce((s,d)=>s+Math.max(0,debtRemaining(d)),0);}

function bizStats(id){
  return {
    income: sumTx(t=>t.type==="biz_income"&&t.biz===id),
    expense: sumTx(t=>t.type==="biz_expense"&&t.biz===id),
    draw: sumTx(t=>t.type==="draw"&&t.biz===id),
    contribution: sumTx(t=>t.type==="contribution"&&t.biz===id),
    balance: bizBalance(id),
  };
}

/* месячные ряды для графиков (последние 6 месяцев) */
function monthlySeries(){
  const out=[]; const now=new Date();
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const key=d.toISOString().slice(0,7);
    const income=sumTx(t=>t.type==="in"&&monthKey(t.date)===key);
    const expense=sumTx(t=>t.type==="out"&&monthKey(t.date)===key);
    const net=income+ (sumTx(t=>t.type==="draw"&&monthKey(t.date)===key)-sumTx(t=>t.type==="contribution"&&monthKey(t.date)===key)) - expense;
    out.push({key,label:d.toLocaleDateString("ru-RU",{month:"short"}),income,expense,net});
  }
  return out;
}
/* средний чистый личный поток за месяц (для прогноза) */
function avgMonthlyNet(){
  const s=monthlySeries().filter(m=>m.income||m.expense);
  if(!s.length)return 0;
  return s.reduce((a,m)=>a+m.net,0)/s.length;
}

function forecastMini(){
  const pb=personalBalance();
  const avg=avgMonthlyNet();
  const in3=pb+avg*3;
  return '<div class="card"><div class="card-h"><h3>Прогноз баланса</h3><button class="btn ghost sm" data-act="nav" data-v="forecast">Детали →</button></div><div class="card-b">'+
    '<div class="kpi-line"><span class="muted">Сейчас на руках</span><b>'+fmt(pb)+'</b></div>'+
    '<div class="kpi-line"><span class="muted">Средний поток / мес</span><b class="'+(avg>=0?'pos':'neg')+'">'+fmt(avg,true)+'</b></div>'+
    '<div class="kpi-line"><span class="muted">Через 3 месяца (оценка)</span><b class="'+(in3>=pb?'pos':'neg')+'">'+fmt(in3)+'</b></div>'+
    '<div class="fs12 muted" style="margin-top:8px">Оценка по среднему за последние месяцы. Чем регулярнее записи — тем точнее прогноз.</div>'+
  '</div></div>';
}

      '</div>'+
      '<div class="mono" style="font-weight:700;font-size:24px;color:'+(bal<0?'var(--liab)':(isBusinessAccount(a)?'var(--biz)':'var(--personal)'))+'">'+fmt(bal,false,a.currency)+'</div>'+
      (points.length?'<div class="fs12 muted" style="margin-top:7px">Точки: '+points.map(b=>esc(b.name)).join(' · ')+'</div>':'')+
      (isCredit?'<div style="margin-top:11px"><div class="prog"><span style="width:'+pctUsed+'%;background:var(--liab)"></span></div><div class="fs12 muted" style="display:flex;justify-content:space-between;margin-top:6px"><span>Долг: '+fmt(used,false,a.currency)+'</span><span>Доступно: '+fmt(avail,false,a.currency)+'</span></div></div>':'')+

  }).join('');
  const activeCount=activeAccounts().length, archivedCount=(S.accounts||[]).length-activeCount;

    '<div class="card pad" style="margin-bottom:16px"><div class="two" style="grid-template-columns:1fr 1fr 1fr">'+
      '<div><div class="eyebrow">Личные деньги</div><div class="mono" style="font-size:26px;font-weight:700;color:var(--personal)">'+fmt(personalBalance())+'</div><div class="fs12 muted">только личные счета</div></div>'+
      '<div><div class="eyebrow">Деньги бизнеса</div><div class="mono" style="font-size:26px;font-weight:700;color:var(--biz)">'+fmt(businessBankBalance())+'</div><div class="fs12 muted">все счета ИП и ООО</div></div>'+
      '<div><div class="eyebrow">Всего на счетах</div><div class="mono" style="font-size:26px;font-weight:700">'+fmt(personalBalance()+businessBankBalance())+'</div><div class="fs12 muted">без задвоения общих счетов</div></div>'+
    '</div></div>'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div class="eyebrow">СЧЕТА · '+activeCount+(archivedCount?' · В АРХИВЕ '+archivedCount:'')+'</div><button class="btn sm" data-act="add-acc">'+svg(I.add)+'Добавить счёт</button></div>'+
    ((S.accounts||[]).length?'<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(285px,1fr))">'+cards+'</div>':'<div class="empty">'+svg(I.card)+'<b>Счетов пока нет</b></div>');
}

function updateBusinessAccountOptions(){
  const sel=document.getElementById('f-biz-acc');if(!sel)return;
  const bizId=mval('f-biz'), list=businessAccountsForBiz(bizId), prev=sel.value;
  sel.innerHTML=selectOptions(list,'Нет связанного счёта бизнеса');
  if(list.some(a=>a.id===prev))sel.value=prev;
  const b=bizById(bizId), hint=document.getElementById('f-biz-acc-hint');
  if(hint)hint.textContent=list.length?'Доступны только счета '+(entityById(b?.legalEntityId)?.name||'выбранного юрлица')+', связанные с этой точкой.':'Привяжите счёт к точке в разделе «Счета».';
}
function refreshAddForm(){

  const isEntityTransfer=type==='entity_transfer';
  const isAccountMove=isTransfer||isEntityTransfer;
  const isBiz=['draw','contribution','biz_income','biz_expense'].includes(type);
  const usesPersonal=['in','out','draw','contribution'].includes(type);
  const usesBizAccount=['draw','contribution','biz_income','biz_expense'].includes(type);
  document.getElementById('f-biz-wrap').classList.toggle('hidden',!isBiz);
  document.getElementById('f-acc-wrap').classList.toggle('hidden',!usesPersonal);
  document.getElementById('f-biz-acc-wrap').classList.toggle('hidden',!usesBizAccount);
  document.getElementById('f-transfer-wrap').classList.toggle('hidden',!isAccountMove);
  document.getElementById('f-transfer-result').classList.toggle('hidden',!isAccountMove);
  document.getElementById('f-cat-wrap').classList.toggle('hidden',isTransfer);
  const accLbl={in:'Куда пришло (личный счёт)',out:'С какого личного счёта',draw:'На какой личный счёт вывели',contribution:'С какого личного счёта внесли'};
  if(usesPersonal)document.getElementById('f-acc-lbl').textContent=accLbl[type]||'Личный счёт';
  const baccLbl={draw:'С какого счёта бизнеса',contribution:'На какой счёт бизнеса',biz_income:'На какой счёт поступила выручка',biz_expense:'С какого счёта оплачено'};
  if(usesBizAccount)document.getElementById('f-biz-acc-lbl').textContent=baccLbl[type]||'Счёт бизнеса';
  if(isBiz)updateBusinessAccountOptions();
  if(isAccountMove)ensureTransferAccounts();
  const catSel=document.getElementById('f-cat');let cats=[];
  if(type==='in')cats=S.categories.in;else if(type==='out')cats=S.categories.out;else if(type==='draw')cats=['Вывод собственнику'];else if(type==='contribution')cats=['Взнос собственника'];else if(type==='biz_income')cats=S.categories.bizIn;else if(type==='entity_transfer')cats=['Взнос собственника','Выдача займа','Возврат займа','Оплата по договору','Другое перемещение'];else if(type!=='transfer')cats=S.categories.bizOut;
  catSel.innerHTML=cats.map(c=>'<option>'+esc(c)+'</option>').join('');
  const ex={
    in:'Личный счёт увеличится. Это личный доход.',out:'Личный счёт уменьшится. Это личный расход.',
    transfer:'Разрешены переводы между личными счетами или между счетами одного юрлица.',
    entity_transfer:'Деньги переместятся между счетами разных юрлиц. Операция не попадёт в прибыль; назначение сохранится отдельно.',

    contribution:'Деньги спишутся с личного счёта и поступят на счёт бизнеса. Это не личный расход и не выручка бизнеса.',
    biz_income:'Выручка увеличит реальный банковский счёт и аналитический результат выбранной точки.',
    biz_expense:'Расход уменьшит реальный банковский счёт и результат выбранной точки.'};
  document.getElementById('f-explain').textContent=ex[type]||'';

function ensureTransferAccounts(){const from=document.getElementById('f-from-acc'),to=document.getElementById('f-to-acc');if(!from||!to)return;if(from.value===to.value&&to.options.length>1)to.selectedIndex=from.selectedIndex===0?1:0;}
function sameAccountOwner(a,b){if(!a||!b)return false;if(isPersonalAccount(a)&&isPersonalAccount(b))return true;return isBusinessAccount(a)&&isBusinessAccount(b)&&a.legalEntityId&&a.legalEntityId===b.legalEntityId;}
function transferAmounts(){const from=accById(mval('f-from-acc')),to=accById(mval('f-to-acc')),amount=Number(mval('f-amount'))||0;if(!from||!to||from.id===to.id||amount<=0)return {from,to,amount,toAmount:0};const toAmount=from.currency===to.currency?amount:toBase(amount,from.currency)/rate(to.currency);return {from,to,amount,toAmount};}
function updateTransferPreview(){
  const box=document.getElementById('f-transfer-result');if(!box)return;const {from,to,amount,toAmount}=transferAmounts();
  if(activeAccounts().length<2){box.textContent='Для перевода нужны минимум два активных счёта.';return;}
  if(!from||!to){box.textContent='Выберите счёт списания и счёт зачисления.';return;}
  if(from.id===to.id){box.textContent='Счета должны отличаться.';return;}
  const type=document.getElementById('f-type')?.value||'transfer';
  if(type==='transfer'&&!sameAccountOwner(from,to)){box.textContent='Обычный перевод между разными владельцами запрещён. Выберите «Между ИП и ООО», «Вывод» или «Взнос».';return;}

  if(amount<=0){box.textContent='Введите сумму перевода.';return;}
  box.innerHTML='Со счёта <b>'+esc(from.name)+'</b> спишется <span class="mono">'+fmt(amount,false,from.currency)+'</span>; на <b>'+esc(to.name)+'</b> зачислится <span class="mono">'+fmt(toAmount,false,to.currency)+'</span>.';
}

    const details='<span class="tag-cat">'+esc(t.cat||"—")+'</span>'+(b?' <span class="fs12 muted">'+b.emoji+' '+esc(b.name)+' · '+esc(entityById(b.legalEntityId)?.name||'')+'</span>':'')+(t.note?'<div class="fs12 muted" style="margin-top:2px">'+esc(t.note)+'</div>':'');

function dueLabel(due){
  if(!due)return {txt:"без срока",cls:""};
  const diff=Math.round((new Date(due)-new Date(TODAY()))/86400000);
  if(diff<0)return {txt:"просрочено на "+Math.abs(diff)+" дн.",cls:"due-over"};
  if(diff===0)return {txt:"сегодня",cls:"due-soon"};
  if(diff<=7)return {txt:"через "+diff+" дн.",cls:"due-soon"};
  return {txt:"до "+fmtDate(due),cls:""};
}
function debtCard(d){
  const rem=debtRemaining(d); const paid=d.amount-rem;
  const p=Math.min(100,Math.round(paid/d.amount*100));
  const dd=dueLabel(d.due);
  const color=d.dir==="in"?"var(--asset)":"var(--liab)";
  const bg=d.dir==="in"?"var(--asset-bg)":"var(--liab-bg)";
  return '<div class="card pad" style="margin-bottom:12px">'+
    '<div style="display:flex;align-items:flex-start;gap:12px">'+
      '<div class="avatar" style="background:'+bg+';color:'+color+'">'+(d.who[0]||"?").toUpperCase()+'</div>'+
      '<div style="flex:1;min-width:0">'+
        '<div style="font-weight:600;font-family:var(--disp)">'+esc(d.who)+'</div>'+
        '<div class="fs12 muted">'+(d.note?esc(d.note)+" · ":"")+'выдан '+fmtDate(d.date)+' · <span class="'+dd.cls+'">'+dd.txt+'</span></div>'+
      '</div>'+
      '<div style="text-align:right"><div class="num" style="font-weight:700;font-size:16px;color:'+color+'">'+fmt(rem)+'</div>'+
      (paid>0?'<div class="fs12 muted num">из '+fmt(d.amount)+'</div>':'')+'</div>'+
    '</div>'+
    (paid>0?'<div class="prog" style="margin-top:10px"><span style="width:'+p+'%;background:'+color+'"></span></div>':'')+
    '<div style="display:flex;gap:8px;margin-top:11px">'+
      (rem>0?'<button class="btn sm" data-act="repay" data-id="'+d.id+'">'+(d.dir==="in"?"Отметить возврат":"Отметить платёж")+'</button>':'<span class="chip c-in">✓ Закрыт</span>')+
      '<button class="btn sm ghost" data-act="edit-debt" data-id="'+d.id+'">'+svg(I.edit)+'</button>'+
      '<button class="btn sm ghost danger" data-act="del-debt" data-id="'+d.id+'">'+svg(I.trash)+'</button>'+
    '</div>'+
  '</div>';
}
function viewDebts(){
  const inD=S.debts.filter(d=>d.dir==="in");
  const outD=S.debts.filter(d=>d.dir==="out");
  const colIn=inD.length?inD.map(debtCard).join(""):'<div class="empty" style="padding:26px"><b>Вам никто не должен</b></div>';

   ВИД: ПРОГНОЗ
   ========================================================= */
function viewForecast(){
  const pb=personalBalance();
  const avg=avgMonthlyNet();
  // прогноз баланса на 6 месяцев с учётом плановых возвратов долгов
  const pts=[{label:"сейчас",val:pb}];
  let run=pb; const now=new Date();
  const months=[];
  for(let i=1;i<=6;i++){
    const md=new Date(now.getFullYear(),now.getMonth()+i,1);
    const key=md.toISOString().slice(0,7);
    // плановые движения долгов в этом месяце
    let debtFlow=0;
    for(const d of S.debts){ const rem=debtRemaining(d); if(rem<=0||!d.due)continue;
      if(monthKey(d.due)===key){ debtFlow+= d.dir==="in"?rem:-rem; }
    }
    run=run+avg+debtFlow;
    pts.push({label:md.toLocaleDateString("ru-RU",{month:"short"}),val:run});
    months.push({key,label:md.toLocaleDateString("ru-RU",{month:"long"}),avg,debtFlow});
  }
  const line=lineChart(pts);
  // таблица предстоящих движений по долгам
  const debtRows=S.debts.map(d=>({d,rem:debtRemaining(d)})).filter(x=>x.rem>0&&x.d.due)
    .sort((a,b)=>a.d.due.localeCompare(b.d.due))
    .map(({d,rem})=>{const dd=dueLabel(d.due);return '<tr><td data-label="Контрагент">'+esc(d.who)+'</td><td data-label="Тип"><span class="chip '+(d.dir==="in"?"c-biz_income":"c-out")+'">'+(d.dir==="in"?"поступление":"платёж")+'</span></td><td class="fs13 '+dd.cls+'" data-label="Срок">'+fmtDate(d.due)+' · '+dd.txt+'</td><td class="num '+(d.dir==="in"?"blue":"neg")+'" data-label="Сумма" style="font-weight:600">'+(d.dir==="in"?"+":"−")+fmt(rem).replace("−","")+'</td></tr>';}).join("");

  const in1=pb+avg, in3=pb+avg*3, in6=run;
  return head("Прогноз","Оценка будущего баланса по вашим средним показателям и запланированным возвратам долгов.")+
  '<div class="stats" style="margin-bottom:16px">'+
    statCard("Через 1 месяц",fmt(pb+avg),"оценка",in1>=pb?"i-in":"i-liab",I.forecast)+
    statCard("Через 3 месяца",fmt(in3),"оценка",in3>=pb?"i-in":"i-liab",I.forecast)+
    statCard("Через 6 месяцев",fmt(in6),"с учётом долгов",in6>=pb?"i-in":"i-liab",I.forecast)+
    statCard("Средний поток / мес",fmt(avg,true),"доходы − расходы",avg>=0?"i-in":"i-liab",I.in)+
  '</div>'+
  '<div class="card" style="margin-bottom:16px"><div class="card-h"><h3>Прогноз личного баланса</h3><div class="fs12 muted">6 месяцев вперёд</div></div><div class="card-b">'+line+
    '<div class="fs12 muted" style="margin-top:10px">Линия учитывает средний ежемесячный поток ('+fmt(avg,true)+') и разовые возвраты долгов по срокам. Это оценка, а не гарантия — ведите записи регулярно для точности.</div>'+
  '</div></div>'+
  '<div class="card"><div class="card-h"><h3>Плановые движения по долгам</h3></div>'+
    (debtRows?'<table><thead><tr><th>Контрагент</th><th>Тип</th><th>Срок</th><th class="num">Сумма</th></tr></thead><tbody>'+debtRows+'</tbody></table>':'<div class="empty" style="padding:24px"><span class="fs13">Нет долгов со сроком возврата.</span></div>')+
  '</div>';
}

function viewGoals(){
  const avg=avgMonthlyNet();
  const cards=S.goals.map(g=>{

    // прогноз даты достижения по среднему потоку

    else eta="нужен положительный поток";
    return '<div class="card pad" style="margin-bottom:14px">'+
      '<div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:12px">'+

      '</div></div>';
  }).join("");

  (S.goals.length?cards:'<div class="empty">'+svg(I.goal)+'<b>Целей пока нет</b><span class="fs13">Добавьте первую — например, «подушка безопасности» или «новая студия».</span></div>');
}

/* =========================================================
   ГРАФИКИ (SVG вручную)
   ========================================================= */
function barChart(series){
  const W=560,H=180,pad=28,bw=Math.min(46,(W-pad*2)/series.length-14);
  const max=Math.max(1,...series.map(s=>Math.max(Math.abs(s.income),Math.abs(s.expense))));
  const zeroY=H-pad-30;
  const scale=(zeroY-14)/max;
  let bars="";
  series.forEach((s,i)=>{
    const x=pad+i*((W-pad*2)/series.length)+((W-pad*2)/series.length-bw*2-6)/2;
    const ih=s.income*scale, eh=s.expense*scale;
    bars+='<rect x="'+x+'" y="'+(zeroY-ih)+'" width="'+bw+'" height="'+Math.max(1,ih)+'" rx="3" fill="var(--personal)" opacity="0.85"/>';
    bars+='<rect x="'+(x+bw+6)+'" y="'+(zeroY-eh)+'" width="'+bw+'" height="'+Math.max(1,eh)+'" rx="3" fill="var(--liab)" opacity="0.75"/>';
    bars+='<text x="'+(x+bw+3)+'" y="'+(H-16)+'" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--mono)">'+s.label+'</text>';
    if(s.net!==0)bars+='<text x="'+(x+bw+3)+'" y="'+(zeroY-Math.max(ih,eh)-6)+'" text-anchor="middle" font-size="9.5" fill="'+(s.net>=0?'var(--personal)':'var(--liab)')+'" font-family="var(--mono)" font-weight="600">'+(s.net>=0?'+':'−')+kfmt(Math.abs(s.net))+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">'+
    '<line x1="'+pad+'" y1="'+zeroY+'" x2="'+(W-pad)+'" y2="'+zeroY+'" stroke="var(--line)"/>'+bars+
    '</svg>'+
    '<div style="display:flex;gap:16px;margin-top:6px;font-size:12px" class="muted"><span><span style="display:inline-block;width:9px;height:9px;background:var(--personal);border-radius:2px;margin-right:5px"></span>Доходы</span><span><span style="display:inline-block;width:9px;height:9px;background:var(--liab);border-radius:2px;margin-right:5px"></span>Расходы</span></div>';
}
function lineChart(pts){
  const W=620,H=200,pad=40;
  const vals=pts.map(p=>p.val);
  const min=Math.min(...vals,0),max=Math.max(...vals,1);
  const rng=(max-min)||1;
  const X=i=>pad+i*((W-pad*2)/(pts.length-1));
  const Y=v=>pad/2+ (H-pad-pad/2)*(1-(v-min)/rng);
  let path="",area="",dots="",labels="";
  pts.forEach((p,i)=>{
    const x=X(i),y=Y(p.val);
    path+=(i?"L":"M")+x+" "+y+" ";
    dots+='<circle cx="'+x+'" cy="'+y+'" r="3.5" fill="var(--personal)"/>';
    labels+='<text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="var(--mono)">'+p.label+'</text>';
    labels+='<text x="'+x+'" y="'+(y-9)+'" text-anchor="middle" font-size="9.5" fill="var(--ink-2)" font-family="var(--mono)" font-weight="600">'+kfmt(p.val)+'</text>';
  });
  area="M"+X(0)+" "+Y(pts[0].val)+" "+pts.map((p,i)=>"L"+X(i)+" "+Y(p.val)).join(" ")+" L"+X(pts.length-1)+" "+Y(min)+" L"+X(0)+" "+Y(min)+" Z";
  const zeroY=Y(0);
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="display:block">'+
    '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--personal)" stop-opacity="0.18"/><stop offset="1" stop-color="var(--personal)" stop-opacity="0"/></linearGradient></defs>'+
    (min<0?'<line x1="'+pad+'" y1="'+zeroY+'" x2="'+(W-pad)+'" y2="'+zeroY+'" stroke="var(--line-strong)" stroke-dasharray="4 4"/>':'')+
    '<path d="'+area+'" fill="url(#g)"/>'+
    '<path d="'+path+'" fill="none" stroke="var(--personal)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'+
    dots+labels+'</svg>';
}
function kfmt(n){const a=Math.abs(n);if(a>=1e6)return(n/1e6).toFixed(1).replace(".0","")+"м";if(a>=1e3)return Math.round(n/1e3)+"к";return Math.round(n);}

async function awaitSignOut(){

  catch(e){ toast("Не удалось выйти — проверьте соединение"); }
}
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el)return;
  const act=el.dataset.act;

  if(act==="logout"){if(window.PFBackend)awaitSignOut();return;}
  if(act==="nav"){closeModal();S.ui.view=el.dataset.v;persist();render();if(S.ui.view==="add")setTimeout(refreshAddForm,0);return;}
  if(act==="more-menu"){
    const items=[["tx","Операции",I.tx],["business","Бизнес",I.biz],["forecast","Прогноз",I.forecast],["goals","Цели",I.goal],["settings","Настройки",I.settings]];
    const body=items.map(([id,label,ic])=>'<button class="sheet-item '+(S.ui.view===id?'on':'')+'" data-act="nav" data-v="'+id+'">'+svg(ic)+'<span>'+label+'</span></button>').join("");
    openSheet("Разделы",body);
    return;
  }
  if(act==="dismiss-reminder"){S.meta.lastEntryDate=TODAY();persist();render();return;}

  // add form
  if(act==="pick-type"){
    document.querySelectorAll("#type-picker .type-btn").forEach(b=>b.classList.remove("on"));
    el.classList.add("on");
    document.getElementById("f-type").value=el.dataset.t;
    refreshAddForm();return;

function saveTx(){
  const type=document.getElementById("f-type").value,amount=+mval("f-amount");
  if(!amount||amount<=0){toast("Введите сумму больше нуля");return;}
  const date=mval("f-date")||TODAY(),note=mval("f-note").trim();
  if(type==="transfer"||type==="entity_transfer"){
    const {from,to,toAmount}=transferAmounts();
    if(!from||!to||from.archived||to.archived||from.id===to.id){toast("Выберите два разных активных счёта");return;}
    if(type==="transfer"&&!sameAccountOwner(from,to)){toast("Обычный перевод возможен только внутри одного владельца");return;}
    if(type==="entity_transfer"&&(!isBusinessAccount(from)||!isBusinessAccount(to)||from.legalEntityId===to.legalEntityId)){toast("Выберите счета двух разных юридических лиц");return;}
    S.tx.push({id:uid(),type,fromAccount:from.id,toAccount:to.id,amount,toAmount,cat:type==="transfer"?"Перевод между счетами":mval("f-cat"),date,note,rateFrom:rate(from.currency),rateTo:rate(to.currency)});
    S.meta.lastEntryDate=TODAY();persist();toast("Перемещение сохранено · "+fmt(amount,false,from.currency));S.ui.view="tx";render();return;
  }
  const t={id:uid(),type,amount,cat:mval("f-cat"),date,note};
  if(["draw","contribution","biz_income","biz_expense"].includes(type)){
    t.biz=mval("f-biz");const b=bizById(t.biz),ba=accById(mval("f-biz-acc"));
    if(!b){toast("Выберите точку бизнеса");return;}
    if(!ba||ba.archived||!isBusinessAccount(ba)||ba.legalEntityId!==b.legalEntityId||!(ba.businessIds||[]).includes(b.id)){toast("Выберите счёт, связанный с этой точкой");return;}
    if(type==="biz_income"||type==="biz_expense")t.account=ba.id;
    else{
      const pa=accById(mval("f-acc"));if(!pa||pa.archived||!isPersonalAccount(pa)){toast("Добавьте и выберите личный счёт");return;}
      t.account=pa.id;t.businessAccount=ba.id;
      t.businessAmount=pa.currency===ba.currency?amount:toBase(amount,pa.currency)/rate(ba.currency);
    }
  }else if(type==="in"||type==="out"){
    const pa=accById(mval("f-acc"));if(!pa||pa.archived||!isPersonalAccount(pa)){toast("Добавьте и выберите личный счёт");return;}t.account=pa.id;
  }
  S.tx.push(t);S.meta.lastEntryDate=TODAY();persist();toast("Операция сохранена · "+fmt(amount,false,accById(t.account)?.currency||baseCode()));S.ui.view="tx";render();
}

function downloadJSON(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);const a=document.createElement("a");
  a.href=url;a.download="finance-backup-"+TODAY()+".json";a.click();URL.revokeObjectURL(url);
  toast("Копия скачана");
}
function importJSON(){
  const inp=document.createElement("input");inp.type="file";inp.accept=".json";
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const data=JSON.parse(r.result);S=data;ensureBusinessModel();S.ui={view:"overview",txFilter:"all",txPeriod:"all"};persist();render();toast("Данные загружены и обновлены");}catch(err){toast("Не удалось прочитать файл");}};
    r.readAsText(f);};
  inp.click();
}

function normalizeName(v){return String(v||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9]+/g,' ').trim();}
function ensureBusinessModel(){
  let changed=false;
  S.legalEntities=Array.isArray(S.legalEntities)?S.legalEntities:[];
  const ensureEntity=(id,name,type)=>{let x=S.legalEntities.find(e=>e.id===id)||S.legalEntities.find(e=>normalizeName(e.name)===normalizeName(name));if(!x){x={id,name,type,archived:false};S.legalEntities.push(x);changed=true;}else{if(!x.type){x.type=type;changed=true;}}return x;};
  const ip=ensureEntity('le-ip','ИП','ip'),ooo=ensureEntity('le-ooo','ООО','ooo');
  S.businesses=Array.isArray(S.businesses)?S.businesses:[];
  const bizDefs=[
    ['biz-coffee','Кофейня','☕',ip.id,false,/коф/],['biz-vending','Вендинг','🥤',ip.id,false,/вендинг/],['biz-tolbukhina','Студия Толбухина, 2','🧘',ip.id,false,/толбух/],['biz-kuibysheva','Студия Куйбышева, 22','🧘',ooo.id,false,/куйбыш/],['biz-masherova','Студия Машерова, 11','🧘',ooo.id,false,/машеров/],['biz-ooo-common','Общие расходы ООО','🏢',ooo.id,true,/общ.*ооо/]
  ];
  const bizMap={};
  for(const [id,name,emoji,legalEntityId,technical,rx] of bizDefs){let b=S.businesses.find(x=>x.id===id)||S.businesses.find(x=>rx.test(normalizeName(x.name)));if(!b){b={id,name,emoji,legalEntityId,opening:0,archived:false,technical};S.businesses.push(b);changed=true;}else{if(!b.legalEntityId){b.legalEntityId=legalEntityId;changed=true;}if(typeof b.archived!=='boolean'){b.archived=false;changed=true;}if(technical&&!b.technical){b.technical=true;changed=true;}}bizMap[id]=b.id;}
  for(const b of S.businesses){if(!b.legalEntityId){b.legalEntityId=ip.id;b.needsOwnershipReview=true;changed=true;}if(typeof b.archived!=='boolean'){b.archived=false;changed=true;}}
  S.accounts=Array.isArray(S.accounts)?S.accounts:[];
  for(const a of S.accounts){if(!a.scope){a.scope='personal';a.legalEntityId=null;a.businessIds=[];changed=true;}if(!Array.isArray(a.businessIds)){a.businessIds=[];changed=true;}if(typeof a.archived!=='boolean'){a.archived=false;changed=true;}if(typeof a.bankName!=='string'){a.bankName='';changed=true;}}
  const accDefs=[
    ['acc-ip-paritet','ИП · Паритет Банк','Паритет Банк',ip.id,[bizMap['biz-coffee']],/паритет/],
    ['acc-ip-belarusbank','ИП · Беларусбанк','Беларусбанк',ip.id,[bizMap['biz-vending']],/беларус/],
    ['acc-ip-alfa','ИП · Альфа-Банк','Альфа-Банк',ip.id,[bizMap['biz-tolbukhina']],/альфа/],
    ['acc-ooo-alfa','ООО · Альфа-Банк','Альфа-Банк',ooo.id,[bizMap['biz-kuibysheva'],bizMap['biz-masherova'],bizMap['biz-ooo-common']],/альфа/]
  ];
  const claimed=new Set();
  for(const [id,name,bankName,legalEntityId,businessIds,bankRx] of accDefs){
    let a=S.accounts.find(x=>x.id===id);
    if(!a){
      const candidates=S.accounts.filter(x=>!claimed.has(x.id)&&!hasAccountTx(x.id)&&bankRx.test(normalizeName((x.bankName||'')+' '+(x.name||''))));
      if(bankRx.source==='альфа'){
        const ownerCue=legalEntityId===ooo.id?/ооо/:/ип/;
        a=candidates.find(x=>ownerCue.test(normalizeName(x.name)));
        if(!a&&candidates.length&&(candidates.length>=2||[...claimed].some(v=>v==='acc-ip-alfa'||v==='acc-ooo-alfa')))a=candidates[0];
      }else a=candidates[0];
      if(a){a.id=id;changed=true;}
    }
    if(!a){a={id,name,bankName,emoji:'🏦',kind:'card',currency:'BYN',opening:0,limit:0,archived:false,scope:'business',legalEntityId,businessIds};S.accounts.push(a);changed=true;}
    else{
      claimed.add(a.id);a.scope='business';a.legalEntityId=legalEntityId;a.businessIds=[...new Set([...(a.businessIds||[]),...businessIds])];
      if(!a.bankName)a.bankName=bankName;if(!a.name||/^(альфа|паритет|беларус)/i.test(a.name))a.name=name;
    }
  }
  S.meta=S.meta||{};if((S.meta.modelVersion||0)<4){S.meta.modelVersion=4;changed=true;}
  return changed;
}

let authSubscribed=false; let initRun=0;
function renderLogin(){
  S=null; closeModal();
  const app=document.getElementById("app");
  app.innerHTML='<div style="min-height:100vh;display:grid;place-items:center;padding:20px">'+
    '<div class="card pad" style="width:100%;max-width:420px">'+
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:18px"><div class="brand" style="padding:0"><div class="mark">Br</div><div><b>Финансы</b><small>личный контроль</small></div></div></div>'+
      '<h1 style="font-size:23px;margin-bottom:5px">Вход</h1>'+
      '<p class="muted" style="margin:0 0 18px">Введите имя пользователя и пароль.</p>'+
      '<div class="field"><label>Имя пользователя</label><input class="inp" id="login-username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="admin"></div>'+
      '<div class="field"><label>Пароль</label><input class="inp" id="login-password" type="password" autocomplete="current-password" placeholder="Пароль"></div>'+
      '<button class="btn primary" id="login-submit" style="width:100%;justify-content:center">Войти</button>'+
      '<div class="fs13 muted" id="login-status" style="margin-top:12px;min-height:20px"></div>'+
    '</div></div>';
  const username=document.getElementById("login-username");
  const password=document.getElementById("login-password");
  const btn=document.getElementById("login-submit");
  const status=document.getElementById("login-status");
  const submit=async()=>{
    const name=username.value.trim().toLowerCase();
    const pass=password.value;
    if(!/^[a-z0-9._-]{3,32}$/.test(name)){
      status.textContent="Имя: 3–32 символа, латинские буквы, цифры, точка, дефис или подчёркивание";
      username.focus();return;
    }
    if(!pass){status.textContent="Введите пароль";password.focus();return;}
    btn.disabled=true;btn.textContent="Входим…";status.textContent="";
    try{
      const {error}=await window.PFBackend.signInWithUsernamePassword(name,pass);
      if(error)throw error;
      status.textContent="Вход выполнен";
    }catch(e){
      status.textContent="Неверное имя пользователя или пароль";
      btn.disabled=false;btn.textContent="Войти";
      password.select();
    }
  };
  btn.addEventListener("click",submit);
  username.addEventListener("keydown",e=>{if(e.key==="Enter")password.focus();});
  password.addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
  username.focus();
}
async function init(){
  const run=++initRun;
  if(window.PFBackendReady)await window.PFBackendReady;
  if(window.PFBackend){
    if(!authSubscribed){
      authSubscribed=true;
      window.PFBackend.onChange(user=>{if(user)init();else renderLogin();});
    }
    if(!window.PFBackend.user){renderLogin();return;}
  }
  const saved=await Store.load();
  if(run!==initRun)return;
  S=saved||seed();
  if(ensureBusinessModel())persist();
  // Однократный переход с прежней RUB-демо-базы: полностью очищаем данные и начинаем в BYN.
  if(saved&&((S.settings&&S.settings.baseCurrency)!=="BYN"||!(S.currencies||[]).some(c=>c.code==="BYN"))){
    S=seed();
    persist();
  }
  // миграция: старый единый список categories.biz -> bizIn / bizOut
  if(S.categories && (!S.categories.bizIn || !S.categories.bizOut)){
    const old=S.categories.biz||[];
    S.categories.bizIn=old.filter(c=>/выруч|доход/i.test(c));
    if(!S.categories.bizIn.length)S.categories.bizIn=["Выручка","Прочий доход бизнеса"];
    S.categories.bizOut=old.filter(c=>!/выруч|доход/i.test(c));
    if(!S.categories.bizOut.length)S.categories.bizOut=["ЗП тренерам","ЗП администраторам","Аренда помещения","Закупка товара","Обслуживание аппарата","Реклама","Ремонт / инвентарь","Прочее"];
    delete S.categories.biz;
    persist();
  }
  // миграция: старая модель без валют/счетов -> добавляем базовую валюту и единый счёт
  if(!S.currencies){
    const symb=(S.settings&&S.settings.currency)||"₽";
    S.currencies=[{code:"RUB",symbol:symb,rate:1}];
    if(!S.settings)S.settings={};
    S.settings.baseCurrency="RUB";
    persist();
  }
  if(!S.accounts){
    S.accounts=[{id:"a0",name:"Основной счёт",bankName:"",kind:"card",currency:baseCode(),opening:(S.settings&&+S.settings.openingPersonal)||0,limit:0,emoji:"💳",scope:"personal",legalEntityId:null,businessIds:[],archived:false}];
    // привязываем существующие личные операции к основному счёту
    (S.tx||[]).forEach(t=>{ if(!t.account && (t.type==="in"||t.type==="out"||t.type==="draw"||t.type==="contribution"))t.account="a0"; });
    persist();
  }
  let accountMetaChanged=false;
  (S.accounts||[]).forEach(a=>{if(typeof a.archived!=="boolean"){a.archived=false;accountMetaChanged=true;}});
  if(accountMetaChanged)persist();
  if(!S.ui)S.ui={view:"overview",txFilter:"all",txPeriod:"all"};
  if(!saved)persist();
  render();
  if(S.ui.view==="add")setTimeout(refreshAddForm,0);
  updateRatesFromNBRB().then(ok=>{if(ok&&S){render();if(S.ui.view==="add")setTimeout(refreshAddForm,0);}});
}
init();
</script>
